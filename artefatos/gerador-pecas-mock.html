<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>elaw adv — Gerador de peças</title>
<style>
/* Tokens (mesma base do mock de Documentos / UI-Kit) */
:root{
  --font-head:system-ui,-apple-system,"Segoe UI",sans-serif;--font-body:system-ui,-apple-system,"Segoe UI",sans-serif;
  --color-primary-darken:#4a2661;--color-primary-dark:#5c2e74;--color-primary:#70398c;--color-primary-light:#9a6bb5;--color-primary-lighten:#d9c6e6;--color-primary-lightest:#f6f0fa;
  --color-positive-dark:#23634a;--color-positive:#2e7d5b;--color-positive-lightest:#e6f2ec;
  --color-negative-dark:#b91c1c;--color-negative:#dc2626;--color-negative-lightest:#fef2f2;
  --color-warning-dark:#92400e;--color-warning:#d97706;--color-warning-lightest:#fffbeb;
  --color-info-dark:#1e40af;--color-info:#2563eb;--color-info-lightest:#eff6ff;
  --s50:#f8fafc;--s100:#f1f5f9;--s200:#e2e8f0;--s300:#cbd5e1;--s400:#94a3b8;--s500:#64748b;--s700:#334155;--s900:#0f172a;
  --body-bg:var(--s100);--text:var(--s900);--text2:var(--s500);--border:var(--s200);--card:#fff;
  --c1:#70398c;--c2:#2563eb;--c3:#d97706;--c4:#2e7d5b;--c5:#dc2626;--c6:#0e7490;--c7:#64748b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#2b2f36;font-family:var(--font-body);font-size:14px;color:var(--text);line-height:1.45}
button{font:inherit;color:inherit}
/* Simulador de dispositivo */
.pv{position:fixed;left:16px;bottom:16px;z-index:999;display:flex;gap:4px;align-items:center;background:#111827;color:#fff;border-radius:999px;padding:6px 8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.pv button{border:0;background:none;color:#cbd5e1;padding:6px 12px;border-radius:999px;cursor:pointer}.pv button.on{background:#fff;color:#111827;font-weight:600}
.stage{min-height:100%;display:flex;justify-content:center;padding:0}
.frame{width:100%;min-height:100vh;background:var(--body-bg);container-type:inline-size;container-name:app;position:relative;overflow:hidden}
body.t .frame{width:820px;min-height:1180px;margin:24px 0 90px;border-radius:24px}
body.m .frame{width:390px;min-height:844px;margin:24px 0 90px;border-radius:32px}
body.t .stage,body.m .stage{padding:0 16px}
/* Header do sistema (simulado) */
.ah{height:60px;display:flex;align-items:center;gap:16px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--border)}
.ah-t{font:600 16px var(--font-head);display:flex;gap:8px;align-items:center;min-width:180px}
.ah-s{flex:0 1 480px;margin:0 auto;height:38px;border:1px solid var(--border);border-radius:999px;display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--text2)}
.ah-u{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}.ah-u b{display:block;color:var(--text);font-size:12px}
.av{width:34px;height:34px;border-radius:50%;background:var(--color-primary-lightest);color:var(--color-primary);display:grid;place-items:center;font:700 12px var(--font-head)}
.main{padding:24px;max-width:1400px;margin:0 auto}
/* Componentes UI-Kit simplificados */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:999px;border:1px solid transparent;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;background:none}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn-primary{background:var(--color-primary);color:#fff}.btn-primary:hover{background:var(--color-primary-dark)}
.btn-success{background:var(--color-positive);color:#fff}
.btn-outline{border-color:var(--s300);color:var(--s700);background:#fff}.btn-outline:hover{border-color:var(--color-primary);color:var(--color-primary)}
.btn-ghost{color:var(--color-primary)}
.btn-icon{width:36px;height:36px;padding:0;border-radius:50%;border:0;background:none;display:inline-grid;place-items:center;cursor:pointer;color:var(--s700)}.btn-icon:hover{background:var(--s100)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--s300);background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:var(--s700);white-space:nowrap}
.chip.on{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font:600 11px var(--font-body);white-space:nowrap}
.b-cat{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.b-esc{background:var(--color-info-lightest);color:var(--color-info-dark)}
.b-new{background:var(--color-positive-lightest);color:var(--color-positive-dark)}
.input,.select{width:100%;height:40px;border:1px solid var(--s300);border-radius:10px;padding:0 12px;font:inherit;background:#fff;color:var(--text)}
.input:focus,.select:focus{outline:2px solid var(--color-primary-light);outline-offset:0;border-color:var(--color-primary)}
.label{display:block;font:600 13px var(--font-head);margin-bottom:6px}
.muted{color:var(--text2)}.small{font-size:12px}
h1{font:700 22px var(--font-head);color:var(--color-primary-dark);margin:0}
h2{font:700 17px var(--font-head);margin:0}
.ic{display:inline-flex;flex-shrink:0}
/* Biblioteca */
.lib-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 20px}
.lib-head .grow{flex:1;min-width:200px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{border:1px solid var(--border);border-radius:12px;padding:8px 12px;background:#fff;min-width:130px}.stat b{display:block;font:700 18px var(--font-head)}.stat span{font-size:12px;color:var(--text2)}
.filters{display:flex;gap:8px;padding:0 20px 16px;overflow-x:auto;scrollbar-width:none}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 12px}
.sec h2 small{font:500 13px var(--font-body);color:var(--text2);margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.row-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:210px;gap:18px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tpl{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--border);border-radius:16px;padding:12px;transition:border-color .15s}
.tpl:hover,.tpl:focus-within{border-color:var(--color-primary)}
.tpl-top{display:flex;align-items:center;gap:6px;margin-bottom:10px;min-height:24px}
.tpl-top .badge{max-width:70%;overflow:hidden;text-overflow:ellipsis}
.tpl-top .star{margin-left:auto}
.star{width:30px;height:30px;border:0;background:none;border-radius:50%;cursor:pointer;color:var(--s400);display:grid;place-items:center}.star.on{color:var(--color-warning)}.star:hover{background:var(--s100)}
.sheet{position:relative;aspect-ratio:210/297;background:#fff;border:1px solid var(--s200);border-radius:6px;box-shadow:0 1px 2px rgba(15,23,42,.06),0 6px 16px -10px rgba(15,23,42,.25);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:14% 12%}
.sheet::before,.sheet::after{content:"";position:absolute;left:12%;right:12%;height:46px;background:repeating-linear-gradient(to bottom,var(--s200) 0 3px,transparent 3px 9px)}
.sheet::before{top:9%}.sheet::after{bottom:9%;right:40%}
.sheet-name{position:relative;z-index:1;text-align:center;font:700 15px/1.3 Georgia,"Times New Roman",serif;color:var(--s900);background:#fff;padding:6px 4px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sheet-over{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;background:rgba(246,240,250,.72);opacity:0;transition:opacity .15s}
.tpl:hover .sheet-over,.tpl:focus-within .sheet-over{opacity:1}
.tpl-foot{display:flex;align-items:center;gap:6px;margin-top:10px;min-height:32px}
.tpl-foot .meta{flex:1;min-width:0;font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{position:absolute;z-index:50;min-width:230px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px -8px rgba(15,23,42,.3);padding:6px}
.menu button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;font-size:14px}
.menu button:hover{background:var(--s100)}.menu button:disabled{opacity:.45;cursor:not-allowed}
.menu .danger{color:var(--color-negative)}.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}
/* Wizard */
.wz{display:flex;flex-direction:column;gap:16px}
.wz-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px}
.steps{display:flex;gap:6px;align-items:center;margin-left:auto}
.step{display:flex;align-items:center;gap:8px;font:600 13px var(--font-head);color:var(--text2)}
.step i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;border:2px solid var(--s300);background:#fff;font-size:12px}
.step.on{color:var(--color-primary)}.step.on i{border-color:var(--color-primary);background:var(--color-primary);color:#fff}
.step.done i{border-color:var(--color-positive);background:var(--color-positive);color:#fff}
.step-sep{width:28px;height:2px;background:var(--s300)}
.origins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.origin{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;padding:18px;border:1px solid var(--border);border-radius:16px;background:#fff;cursor:pointer;min-height:132px}
.origin:hover{border-color:var(--color-primary)}.origin.on{border:2px solid var(--color-primary);background:var(--color-primary-lightest);padding:17px}
.oic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--color-primary-lightest);color:var(--color-primary)}
.origin b{font:700 15px var(--font-head)}
.reclist{display:flex;flex-direction:column;margin-top:10px;max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:12px}
.rec{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--border);background:#fff;cursor:pointer;text-align:left}
.rec:last-child{border-bottom:0}.rec:hover{background:var(--s50)}.rec.on{background:var(--color-primary-lightest)}
.rec .ck{width:20px;height:20px;border-radius:6px;border:2px solid var(--s300);display:grid;place-items:center;flex-shrink:0;color:#fff}.rec.on .ck{background:var(--color-primary);border-color:var(--color-primary)}
.rec .t{flex:1;min-width:0}.rec .t b{display:block}.rec .t span{font-size:12px;color:var(--text2)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:13px}
.switch i{width:38px;height:22px;border-radius:999px;background:var(--s300);position:relative;transition:.15s}.switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch.on i{background:var(--color-primary)}.switch.on i::after{left:19px}
.wz-foot{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--border)}
.wz-foot .info{margin-right:auto;font-size:13px;color:var(--text2)}
.pane{padding:20px}
/* Revisão */
.review{display:grid;grid-template-columns:minmax(320px,400px) minmax(0,1fr);gap:18px;align-items:start}
.fields{display:flex;flex-direction:column;gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:13px}
.check.warn{background:var(--color-warning-lightest);color:var(--color-warning-dark);border:1px solid #fcd34d}
.check.ok{background:var(--color-positive-lightest);color:var(--color-positive-dark);border:1px solid #a7d7c0}
.fgroup{border:1px solid var(--border);border-radius:14px;background:#fff;overflow:hidden}
.fgroup>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font:700 14px var(--font-head)}
.fgroup>summary::-webkit-details-marker{display:none}
.fgroup>summary .cnt{margin-left:auto;font:600 12px var(--font-body);color:var(--text2)}
.fgroup[open]>summary{border-bottom:1px solid var(--border)}
.frow{display:grid;grid-template-columns:22px minmax(0,1fr);gap:4px 10px;padding:10px 14px;border-bottom:1px solid var(--s100);align-items:center}
.frow:last-child{border-bottom:0}
.frow .st{grid-row:span 2;align-self:start;margin-top:22px}
.frow .label{margin:0;font-size:12px;color:var(--text2);font-weight:600}
.frow.miss .input{border-color:var(--color-warning);background:var(--color-warning-lightest)}
.frow .fmt{grid-column:2;font-size:11px;color:var(--text2)}
.st.okc{color:var(--color-positive)}.st.wc{color:var(--color-warning)}
.preview-wrap{background:var(--s200);border-radius:16px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;position:sticky;top:12px;max-height:calc(100vh - 40px);overflow:auto}
.a4{width:100%;max-width:640px;aspect-ratio:210/297;background:#fff;box-shadow:0 4px 18px -6px rgba(15,23,42,.35);padding:9% 10%;font:13px/1.6 Georgia,"Times New Roman",serif;color:#111;overflow:hidden}
.a4 h3{text-align:center;font:700 13px Georgia,serif;letter-spacing:.04em;text-transform:uppercase;margin:0 0 14px}
.a4 p{margin:0 0 10px;text-align:justify;text-indent:2.5em}
.a4 p.ni{text-indent:0}.a4 .center{text-align:center;text-indent:0}
.fv{background:#fff4c2;border-radius:3px;padding:0 2px;cursor:pointer;box-shadow:inset 0 -2px 0 #f5c542}
.fv.miss{background:var(--color-warning-lightest);color:var(--color-warning-dark);box-shadow:inset 0 -2px 0 var(--color-warning);font-style:italic}
.fv.flash{outline:2px solid var(--color-primary);outline-offset:1px}
.pg{font-size:12px;color:var(--text2)}
/* Salvar */
.save{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form .full{grid-column:1/-1}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{display:flex;gap:8px;align-items:center;padding:10px 14px;border:1px solid var(--s300);border-radius:12px;cursor:pointer;font-weight:600;background:#fff}.opt.on{border-color:var(--color-primary);background:var(--color-primary-lightest);color:var(--color-primary-dark)}
.mini-a4{aspect-ratio:210/297;background:#fff;border:1px solid var(--border);border-radius:6px;padding:12%;font:8px/1.5 Georgia,serif;color:#333;overflow:hidden;box-shadow:0 6px 16px -10px rgba(15,23,42,.3)}
/* Manual (step by step) */
.manual{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px}
.mnav{display:flex;flex-direction:column;gap:6px}
.mnav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid transparent;background:none;cursor:pointer;text-align:left;font-weight:600;color:var(--s700)}
.mnav button.on{background:var(--color-primary-lightest);color:var(--color-primary-dark);border-color:var(--color-primary-lighten)}
.mnav button i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;border:2px solid var(--s300)}
.mnav button.done i{background:var(--color-positive);border-color:var(--color-positive);color:#fff}
.mnav button.on i{border-color:var(--color-primary);color:var(--color-primary)}
.mprog{height:6px;border-radius:999px;background:var(--s200);overflow:hidden;margin-bottom:14px}.mprog i{display:block;height:100%;background:var(--color-primary);border-radius:999px}
/* Editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0;background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;min-height:760px}
.ed-bar{grid-column:1/-1;display:flex;align-items:center;gap:4px;padding:8px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ed-bar .sep{width:1px;height:22px;background:var(--border);margin:0 6px}
.ed-bar .select{width:auto;height:32px;font-size:13px}
.tb{width:34px;height:34px;border:0;background:none;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--s700);font-weight:700}.tb:hover,.tb.on{background:var(--color-primary-lightest);color:var(--color-primary-dark)}
.ed-canvas{background:var(--s200);padding:28px;overflow:auto;max-height:820px}
.ed-canvas .a4{margin:0 auto;aspect-ratio:auto;min-height:900px;outline:none}
.ruler{max-width:640px;margin:0 auto 8px;height:18px;background:repeating-linear-gradient(to right,var(--s400) 0 1px,transparent 1px 16px);border-radius:3px;opacity:.6}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--color-primary-lightest);color:var(--color-primary-dark);border:1px solid var(--color-primary-lighten);border-radius:999px;padding:0 8px;font:600 11.5px var(--font-body);vertical-align:1px;cursor:pointer;white-space:nowrap}
.ed-side{border-left:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tabs button{flex:1;border:0;background:none;padding:12px 6px;font:600 13px var(--font-head);color:var(--text2);border-bottom:2px solid transparent;cursor:pointer}.tabs button.on{color:var(--color-primary);border-bottom-color:var(--color-primary)}
.side-body{padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:720px}
.fitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:#fff;cursor:grab}
.fitem:hover{border-color:var(--color-primary)}.fitem small{display:block;color:var(--text2);font-size:11.5px}
.ver{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--s100)}.ver:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--s300);margin-top:5px;flex-shrink:0}.dot.on{background:var(--color-primary)}
/* Peça gerada */
.done-card{max-width:880px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;padding:24px;align-items:start}
.ok-ic{width:48px;height:48px;border-radius:50%;background:var(--color-positive-lightest);color:var(--color-positive);display:grid;place-items:center;margin-bottom:10px}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 12px;margin:16px 0;font-size:14px}.kv dt{color:var(--text2)}.kv dd{margin:0;font-weight:600}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.snack{position:fixed;top:16px;right:16px;z-index:1000;background:#fff;border:1px solid var(--border);border-left:4px solid var(--color-positive);border-radius:12px;padding:12px 16px;box-shadow:0 12px 28px -8px rgba(15,23,42,.35);font-size:14px;max-width:360px;animation:sin .2s}
@keyframes sin{from{transform:translateY(-8px);opacity:0}}
.backlink{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--color-primary);font-weight:600;cursor:pointer;padding:0}
/* ===== TABLET ===== */
@container app (max-width:900px){
  .ah{padding:0 16px}.ah-s{flex-basis:300px}.main{padding:16px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .origins{grid-template-columns:repeat(2,minmax(0,1fr))}
  .review{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .preview-wrap{padding:14px}
  .save{grid-template-columns:1fr}.save .side-prev{display:none}
  .ed{grid-template-columns:1fr}.ed-side{border-left:0;border-top:1px solid var(--border)}.side-body{max-height:none}
  .ed-canvas{padding:16px;max-height:none}
  .manual{grid-template-columns:1fr}.mnav{flex-direction:row;overflow-x:auto}.mnav button{white-space:nowrap}
  .step span{display:none}
}
/* ===== CELULAR ===== */
@container app (max-width:520px){
  .ah{height:56px;gap:8px}.ah-s,.ah-u div{display:none}.ah-t{min-width:0;flex:1}
  .main{padding:12px}
  h1{font-size:20px}
  .lib-head{padding:14px}.stats{display:grid;grid-template-columns:1fr 1fr;width:100%}.stat:last-child{grid-column:1/-1}
  .lib-head .btn-primary{width:100%;height:44px}
  .filters{padding:0 14px 14px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .row-scroll{grid-auto-columns:46%;gap:10px}
  .tpl{padding:8px;border-radius:14px}.sheet-name{font-size:12.5px}
  .sheet-over{opacity:1;background:none;align-items:flex-end;padding-bottom:8px}.sheet-over .btn{height:32px;font-size:12px;padding:0 10px}
  .tpl-foot .meta{font-size:11px}
  .origins{grid-template-columns:1fr;gap:10px}.origin{flex-direction:row;align-items:center;min-height:0;padding:14px}.origin.on{padding:13px}
  .wz-top{padding:12px 14px}.steps{margin-left:0;width:100%;justify-content:space-between}.step-sep{flex:1;width:auto}
  .pane{padding:14px}
  .review{grid-template-columns:1fr}
  .preview-wrap{position:static;max-height:none;order:-1;padding:10px}

const un=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'],dz=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'],ct=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
function ext3(n){if(n===100)return'cem';const c=Math.floor(n/100),r=n%100,p=[];if(c)p.push(ct[c]);if(r){if(r<20)p.push(un[r]);else{p.push(dz[Math.floor(r/10)]+(r%10?' e '+un[r%10]:''));}}return p.join(' e ');}
function extenso(v){v=Math.round(+v*100)/100;const r=Math.floor(v),c=Math.round((v-r)*100);const parts=[];const mi=Math.floor(r/1e6),mil=Math.floor(r%1e6/1000),u=r%1000;
  if(mi)parts.push(ext3(mi)+(mi>1?' milhões':' milhão'));if(mil)parts.push(mil===1?'mil':ext3(mil)+' mil');if(u)parts.push(ext3(u));
  let s=parts.join(parts.length>1&&u&&u<100?' e ':' ')||'zero';s+=r===1?' real':' reais';if(c)s+=' e '+ext3(c)+(c===1?' centavo':' centavos');return s;}

function tagify(html){return html.replace(/<span class="fv[^"]*" data-jump="([^"]+)" title="([^"]+)">[^<]*<\/span>/g,(m,k,l)=>`<span class="tag" contenteditable="false" data-tag="${k}">${ic('tag',11)}${l}</span>`);}
function renderEditor(){const t=S.tpl||TPL[0];const CMD={undo:'undo',redo:'redo',bold:'bold',italic:'italic',under:'underline',al:'justifyLeft',ac:'justifyCenter',aj:'justifyFull',list:'insertUnorderedList'};const tb=(i,l,on)=>`<button class="tb" data-cmd="${CMD[i]}" title="${l}" aria-label="${l}">${ic(i,16)}</button>`;

   :[['Versão 3 · atual','Ana Costa · hoje, 10:12','Ajustou os pedidos'],['Versão 2','Jeziel Silva · 28/10, 16:40','Incluiu justiça gratuita'],['Versão 1','Sistema · 01/10','Modelo original']].map((x,i)=>`<div class="ver"><span class="dot ${i?'':'on'}"></span><div style="flex:1"><b>${x[0]}</b><div class="small muted">${x[1]}</div><div class="small">${x[2]}</div></div>${i?`<button class="btn btn-outline btn-sm">Restaurar</button>`:''}</div>`).join('')+`<span class="small muted">${ic('lock',12)} Editar o modelo não altera as peças já geradas.</span>`;
  app.innerHTML=`<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px"><button class="backlink" data-act="lib">${ic('back',16)}Modelos</button><h2 style="flex:1;min-width:0">${esc(t.nome)} <span class="badge b-esc" style="vertical-align:3px">Rascunho salvo</span></h2><button class="btn btn-outline" data-act="dl">${ic('download',15)}Exportar</button><button class="btn btn-primary" data-act="salvar-modelo">${ic('check',15,3)}Salvar modelo</button></div>

    <div class="ed-canvas"><div class="ruler"></div><div class="a4" id="ed-a4" contenteditable="true" spellcheck="false">${tagify(docHTML({}))}</div></div>

/* ---------- Render ---------- */
function render(){closeMenu();({lib:renderLib,origem:renderOrigem,rev:renderRev,manual:renderManual,save:renderSave,done:renderDone,editor:renderEditor})[S.view]();}
function startTpl(id){closeMenu();S.tpl=TPL.find(t=>t.id===id);S.origem=PICK.rec?'proc':null;S.rec=PICK.rec||null;S.sel.clear();S.lote=false;S.vals={};S.nome='';S.pasta='';S.mstep=0;S.view='origem';render();window.scrollTo(0,0);}
function loadVals(){const id=S.lote?[...S.sel][0]:S.rec;let d={};const p=PROCS.find(x=>x.id===id);if(p)d=p.d;
  const c=CLIENTES.find(x=>x.id===id);if(c){const pp=PROCS.find(x=>x.d['cliente.nome']===c.t);d=Object.assign({},pp?pp.d:{});['processo.numero','processo.vara','processo.tribunal','reus'].forEach(k=>delete d[k]);d['cliente.nome']=c.t;}
  const f=FORNS.find(x=>x.id===id);if(f)d={'cliente.nome':f.t,'cliente.cpf':'','reus':[f.t],'data':'2026-11-04','processo.comarca':'Rio de Janeiro','processo.uf':'RJ'};
  S.vals=Object.assign({},d,ESC);}

document.addEventListener('click',e=>{
  const pv=e.target.closest('[data-pv]');if(pv){document.body.className=pv.dataset.pv==='d'?'':pv.dataset.pv;$$('[data-pv]').forEach(b=>b.classList.toggle('on',b===pv));render();return;}
  if(!e.target.closest('.menu')&&!e.target.closest('[data-menu]')&&!e.target.closest('.pick')&&!e.target.closest('[data-slot]')&&!e.target.closest('.peek')&&!e.target.closest('[data-peek]')&&!e.target.closest('[role=dialog]'))closeMenu();
  const g=k=>e.target.closest(k);let x;
  if(x=g('[data-slot]')){openPick(x.dataset.slot,x);return;}
  if(x=g('[data-pk]')){const k=x.dataset.pk,v=x.dataset.v;if(k==='cat'){PICK.cat=v;S.cat=v;}else PICK.rec=v||null;closeMenu();render();return;}
  if(x=g('[data-menu]')){openMenu(+x.dataset.menu,x);return;}
  if(x=g('[data-cat]')){S.cat=S.cat===x.dataset.cat?null:x.dataset.cat;render();return;}
  if(x=g('[data-mode]')){S.mode=x.dataset.mode;render();return;}
  if(x=g('[data-peek]')){if(e.target.closest('[data-menu]'))return;const id=+x.dataset.peek;S.selT=id;render();openPeek(id);return;}
  if(x=g('[data-filter]')){S.filter=x.dataset.filter;S.cat=null;render();return;}
  if(x=g('[data-fav]')){const t=TPL.find(t=>t.id===+x.dataset.fav);t.fav=!t.fav;const inPeek=!!x.closest('.peek');render();if(inPeek)openPeek(t.id);snack(t.fav?'Adicionado aos favoritos':'Removido dos favoritos');return;}
  if(x=g('[data-use]')){startTpl(+x.dataset.use);return;}
  if(x=g('[data-ma]')){const id=+x.dataset.id,a=x.dataset.ma,t=TPL.find(t=>t.id===id);closeMenu();
    if(a==='use')return startTpl(id);if(a==='fav'){t.fav=!t.fav;render();return;}
    if(a==='dup'){const n=Object.assign({},t,{id:Date.now(),nome:t.nome+' (escritório)',esc:'Jeziel Silva',fav:false,usos:0,novo:false});TPL.unshift(n);S.filter='esc';render();snack('Cópia criada em <b>Do escritório</b>. O modelo do sistema continua intacto.');return;}
    if(a==='edit'){S.tpl=t;S.view='editor';render();return;}
    if(a==='prev'){S.tpl=t;S.vals={};S.view='editor';render();return;}
    if(a==='dl'){snack('Download iniciado: <b>'+esc(t.nome)+'.docx</b>');return;}
    if(a==='campos'){snack('Campos usados: número do processo, vara, comarca, autores, réus, cliente, CPF, valor por extenso, data por extenso, advogado e OAB.');return;}
    if(a==='del'){TPL=TPL.filter(z=>z.id!==id);render();snack('Modelo excluído');return;}}
  if(x=g('[data-origem]')){S.origem=x.dataset.origem;S.rec=null;S.sel.clear();render();return;}
  if(x=g('[data-rec]')){const id=x.dataset.rec;if(S.lote){S.sel.has(id)?S.sel.delete(id):S.sel.add(id);}else S.rec=S.rec===id?null:id;render();return;}
  if(x=g('[data-jump]')){const k=x.dataset.jump;const inp=$(`[data-field="${k}"]`);if(inp){const d=inp.closest('details');if(d)d.open=true;inp.focus();inp.scrollIntoView({block:'center',behavior:'smooth'});}return;}
  if(x=g('[data-mstep]')){S.mstep=+x.dataset.mstep;render();return;}
  if(x=g('[data-fmt]')){const k=x.dataset.fmt;S.fmt.has(k)&&S.fmt.size>1?S.fmt.delete(k):S.fmt.add(k);render();return;}
  if(x=g('[data-edtab]')){S.edTab=x.dataset.edtab;render();return;}
  if(x=g('[data-ins]')){snack('Campo inserido: <b>{{'+x.dataset.ins+'}}</b>');return;}
  if(x=g('[data-act]')){const a=x.dataset.act;
    if(a==='peek-close'){closeMenu();return;}
    if(a==='clear-cat'){PICK.cat=null;S.cat=null;render();return;}
    if(a==='go-phrase'){$('#estante').scrollIntoView({behavior:'smooth'});return;}

  if(!can())$$('.rcol [data-act="novo"]').forEach(b=>{b.disabled=true;b.title='Seu perfil não pode criar modelos';});};
document.addEventListener('click',e=>{const x=e.target.closest('[data-act="side-toggle"]');if(!x)return;e.stopPropagation();const rc=$('.rcol');if(!rc)return;
  if(getComputedStyle(rc).display==='none'){const fr=$('#frame').getBoundingClientRect();$('#menu-root').innerHTML=`<div class="peek-bg" data-act="peek-close" style="left:${fr.left}px;width:${fr.width}px"></div><aside class="peek rside" style="left:${fr.left}px;right:auto;width:${Math.min(320,fr.width-40)}px;padding:16px;overflow:auto">${rc.innerHTML}</aside>`;}else rc.scrollIntoView({behavior:'smooth'});},true);

/* ---------- v4c: Configurações única, com abas (Configurações | Personalização) ---------- */
const _cfgOrig=cfgModal;
function dlgParts(){const d=$('#menu-root [role=dialog]');return {body:d.children[1].innerHTML,acts:d.children[2].innerHTML};}
cfgModal=function(tab){S.cfgTab=tab||S.cfgTab||'cfg';const pers=S.cfgTab==='pers';let p;
  if(pers){idModal();p=dlgParts();p.body+=`<div class="tl-box"><div><b>${ic('layers',15)} Layout da folha</b><br><span class="small muted">Posição do logo, dados, linhas, data, assinatura e marca d'água, por arraste.</span></div><span class="tl-sw"><span class="small">Usar nas peças</span><button class="switch ${TL.on?'on':''}" data-tl="on" role="switch" aria-checked="${TL.on}" aria-label="Usar layout nas peças"><i></i></button></span><button class="btn btn-outline btn-sm" data-act="tl-open">${ic('edit',14)}Editar layout</button></div>`;}
  else{_cfgOrig();p=dlgParts();}
  const tabs=`<div class="cfg-tabs" role="tablist">${[['cfg','lock','Configurações','Regras do gerador'],['pers','pen','Personalização','Identidade e layout das peças']].map(([k,i,l,d])=>`<button role="tab" aria-selected="${S.cfgTab===k}" class="${S.cfgTab===k?'on':''}" data-cfgtab="${k}">${ic(i,15)}<span><b>${l}</b><small>${d}</small></span></button>`).join('')}</div>`;
  modal('Configurações do gerador',tabs+p.body,pers?p.acts:`<button class="btn btn-primary" data-act="peek-close">Concluir</button>`);
  const dg=$('#menu-root [role=dialog]');dg.style.width=pers?'min(940px,calc(100% - 32px))':'min(640px,calc(100% - 32px))';dg.children[1].style.maxHeight='72vh';if(pers)applyIdentity();};
document.addEventListener('click',e=>{const x=e.target.closest('[data-cfgtab]');if(x){e.stopPropagation();cfgModal(x.dataset.cfgtab);return;}
  const a=e.target.closest('[data-act="id-open"]');if(a){e.stopPropagation();setTimeout(()=>cfgModal('pers'));}},true);

render();
</script>
</body>
</html>
