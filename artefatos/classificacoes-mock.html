<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classificações — mock</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--roxo:#5b2a86;--roxo2:#7b3fb0;--verde:#1f9d55;--amb:#f2b33d;--txt:#2b2b33;--mut:#6f6f7b;--bd:#e4e2ea;--bg:#f4f3f7;--card:#fff;--sel:#f1eaf8}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;background:#3b2457;color:var(--txt);font-size:14px}
.back{position:fixed;inset:0;background:rgba(30,15,45,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);width:min(1180px,100%);height:min(780px,100%);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.hd{background:linear-gradient(90deg,var(--roxo),var(--roxo2));color:#fff;padding:16px 22px;display:flex;align-items:center;gap:10px}
.hd b{font-weight:600;font-size:16px;flex:1}.x{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.tabs{display:flex;gap:22px;padding:0 22px;border-bottom:1px solid var(--bd)}
.tab{padding:14px 2px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;font-weight:500}.tab.on{color:var(--txt);border-color:var(--roxo)}
.pill{display:inline-block;border:1px solid var(--bd);border-radius:20px;padding:0 8px;font-size:12px;margin-left:4px}
.tools{display:flex;gap:10px;padding:14px 22px 8px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:220px;border:1px solid var(--bd);border-radius:8px;padding:9px 12px;font:inherit}
.btn{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--mut)}
.btn.on{border-color:var(--roxo);color:var(--roxo);background:var(--sel)}
.btn.pri{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:500}
.chips{display:flex;gap:8px;padding:0 22px 10px;flex-wrap:wrap;align-items:center;font-size:12px}
.chip{border:1px solid var(--bd);border-radius:20px;padding:3px 10px}.chip.g{background:var(--verde);color:#fff;border-color:var(--verde)}.chip.a{background:var(--amb);border-color:var(--amb)}
.chips a{color:var(--roxo);font-weight:500}.lock{margin-left:auto;color:var(--mut)}
.body{flex:1;display:grid;grid-template-columns:330px 1fr;min-height:0;border-top:1px solid var(--bd)}
.side{overflow:auto;padding:12px;background:var(--bg);border-right:1px solid var(--bd)}
.side h5{margin:4px 6px 10px;font-size:11px;letter-spacing:.06em;color:var(--mut)}
.cat{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.cat.on{border-color:var(--roxo);box-shadow:0 0 0 1px var(--roxo)}.cat.off{opacity:.55}
.ic{width:30px;height:30px;border-radius:50%;background:#fbe9dc;color:#e07b39;display:grid;place-items:center;flex:none}
.cat b{font-weight:500;display:block}.cat small{color:var(--mut);font-size:12px}
.main{overflow:auto;padding:18px 24px}
.ttl{display:flex;gap:12px;align-items:flex-start}.ttl h2{margin:0;font-size:20px;font-weight:600}
.badge{font-size:11px;border-radius:6px;padding:2px 7px;font-weight:500}.b-p{background:#ece8f3;color:var(--roxo)}.b-e{background:#e2f4ea;color:var(--verde)}.b-i{background:#eee;color:#888}
.stats{display:flex;gap:10px;margin:14px 0 18px;flex-wrap:wrap}
.st{border:1px solid var(--bd);border-radius:10px;padding:10px 14px;min-width:150px}.st b{font-size:18px;display:block}.st small{color:var(--mut)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:6px 0 8px}.sec h4{margin:0;font-size:13px;color:var(--mut);font-weight:500}
.row{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.row .n{flex:1}.row .q{color:var(--mut);font-size:12px;min-width:80px;text-align:right}
.row.off{background:#fafafa}.row.off .n{color:#999;text-decoration:line-through}
.acts{display:flex;gap:4px}.acts button{border:0;background:none;cursor:pointer;padding:4px 6px;border-radius:6px;color:var(--mut);font-size:13px}.acts button:hover{background:var(--bg);color:var(--txt)}
.new{display:flex;gap:8px;margin:8px 0}.new input{flex:1;border:1px solid var(--roxo);border-radius:8px;padding:9px 12px;font:inherit}
.empty{text-align:center;color:var(--mut);padding:30px;border:1px dashed var(--bd);border-radius:10px}
.ft{border-top:1px solid var(--bd);padding:12px 22px;display:flex;justify-content:flex-end}
.log{border-bottom:1px solid var(--bd);padding:10px 0;font-size:13px}.log small{color:var(--mut);display:block}
.snack{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b2b33;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;display:none}
@media(max-width:760px){.body{grid-template-columns:1fr}.side{max-height:200px}.lock{margin-left:0}}
</style></head><body>
<div class="back"><div class="modal">
 <div class="hd"><span>🏷️</span><b>Classificações</b><button class="x">×</button></div>
 <div class="tabs"><div class="tab on" data-t="c">Classificações</div><div class="tab" data-t="l">Logs <span class="pill" id="nlog">0</span></div></div>
 <div id="vc" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div class="tools"><input class="search" id="q" placeholder="🔍 Buscar categoria ou subcategoria">
   <button class="btn" id="fEsc">👁 Só as do escritório</button><button class="btn" id="fDes">👁 Mostrar desativadas</button>
   <button class="btn pri" id="bNova">+ Nova subcategoria</button></div>
  <div class="chips"><span class="chip" id="cC"></span><span class="chip" id="cS"></span><span class="chip" id="cE"></span>
   <span class="chip g">2 arquivos classificados</span><span class="chip a">85 sem classificação</span><a href="#">Classificar agora</a>
   <span class="lock">🔒 Itens "Padrão" são do sistema e não mudam</span></div>
  <div class="body"><div class="side"><h5>CATEGORIAS</h5><div id="lista"></div></div><div class="main" id="main"></div></div>
 </div>
 <div id="vl" class="main" style="display:none;flex:1"></div>
 <div class="ft"><button class="btn">Fechar</button></div>
</div></div><div class="snack" id="sn"></div>
<script>
const P={"Direito Civil":["Direito das Pessoas","Direito das Obrigações","Direito Contratual","Responsabilidade Civil","Direito das Coisas (Direitos Reais)","Direito Imobiliário","Direito Condominial","Direito Possessório","Direito de Família","Direito das Sucessões","Direito Notarial e Registral","Direitos da Personalidade"],"Direito Trabalhista":[],"Direito Previdenciário":["Aposentadoria","Pensão","Auxílio por incapacidade temporária","Auxílio por incapacidade permanente","BPC"],"Direito Empresarial (Comercial)":["Direito Societário","Direito Cambiário e Títulos de Crédito","Direito Falimentar","Recuperação Judicial e Extrajudicial","Contratos Empresariais","Propriedade Intelectual","Propriedade Industrial","Direito Concorrencial","Direito Bancário","Direito do Mercado de Capitais"],"Direito do Consumidor":["Relações de consumo","Responsabilidade pelo fato do produto ou serviço","Vícios de produtos e serviços","Práticas comerciais abusivas","Contratos de consumo","Superendividamento","Publicidade enganosa","Proteção do consumidor bancário","Comércio eletrônico"],"Direito Internacional Privado":["Conflitos internacionais de leis","Contratos internacionais","Família e sucessões internacionais","Homologação de decisões estrangeiras","Arbitragem internacional"]};
"Constitucional;Administrativo;Tributário;Penal;Eleitoral;Financeiro;Internacional Público;Econômico;Militar;Agrário;Médico;Desportivo;Marítimo;Aeronáutico;da Criança e do Adolescente;da Pessoa Idosa;da Pessoa com Deficiência;Migratório;Aduaneiro".split(";").forEach(n=>P["Direito "+n]=[]);
let id=0;const C=Object.keys(P).sort((a,b)=>a.localeCompare(b)).map(n=>({id:++id,n,arq:0,subs:P[n].map(s=>({id:++id,n:s,pad:1,on:1,arq:0}))}));
const civ=C.find(c=>c.n=="Direito Civil");civ.arq=1;civ.subs[8].arq=1;
const tr=C.find(c=>c.n=="Direito Trabalhista");tr.subs.push({id:++id,n:"Reclamatória trabalhista",pad:0,on:1,arq:0},{id:++id,n:"Acordos extrajudiciais",pad:0,on:0,arq:0});
let sel=civ.id,fE=0,fD=0,q="",novo=0,ren=null;const L=[{t:"Criou a subcategoria “Reclamatória trabalhista” em Direito Trabalhista",u:"Você",d:"hoje 15:20"},{t:"Desativou a subcategoria “Acordos extrajudiciais”",u:"Você",d:"hoje 15:22"}];
const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),nm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const snack=t=>{const e=$("#sn");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2600)};
const vis=c=>c.subs.filter(s=>(fD||s.on)&&(!fE||!s.pad));
function render(){
 const all=C.flatMap(c=>c.subs);$("#cC").textContent=C.length+" categorias";$("#cS").textContent=all.filter(s=>s.pad).length+" subcategorias padrão";$("#cE").textContent=all.filter(s=>!s.pad).length+" do escritório";$("#nlog").textContent=L.length;
 const lc=C.filter(c=>!q||nm(c.n).includes(q)||c.subs.some(s=>nm(s.n).includes(q))).filter(c=>!fE||c.subs.some(s=>!s.pad));
 $("#lista").innerHTML=lc.map(c=>{const t=c.arq+c.subs.reduce((a,s)=>a+s.arq,0);return`<div class="cat ${c.id==sel?"on":""}" data-c="${c.id}"><span class="ic">🏷</span><span><b>${esc(c.n)}</b><small>${vis(c).length} subcategorias · ${t} arquivo${t==1?"":"s"}</small></span></div>`}).join("")||'<div class="empty">Nada encontrado.</div>';
 const c=C.find(x=>x.id==sel);if(!c){$("#main").innerHTML="";return}
 const ss=vis(c).filter(s=>!q||nm(s.n).includes(q)||nm(c.n).includes(q)),tot=c.arq+c.subs.reduce((a,s)=>a+s.arq,0);
 $("#main").innerHTML=`<div class="ttl"><span class="ic">🏷</span><div><h2>${esc(c.n)} <span class="badge b-p">Padrão</span></h2><small style="color:var(--mut)">Categoria do sistema · pode receber arquivos direto ou por subcategoria</small></div></div>
 <div class="stats"><div class="st"><b>${tot}</b><small>arquivos no total</small></div><div class="st"><b>${c.arq}</b><small>só na categoria</small></div><div class="st"><b>${c.subs.filter(s=>s.on).length}</b><small>subcategorias ativas</small></div></div>
 <div class="sec"><h4>SUBCATEGORIAS</h4><button class="btn" data-a="novo">+ Nova subcategoria aqui</button></div>
 ${novo?`<div class="new"><input id="ni" placeholder="Nome da subcategoria em ${esc(c.n)}"><button class="btn pri" data-a="salvar">Salvar</button><button class="btn" data-a="cancel">Cancelar</button></div>`:""}
 ${ss.length?ss.map(s=>`<div class="row ${s.on?"":"off"}">${ren==s.id?`<div class="new" style="flex:1;margin:0"><input id="ri" value="${esc(s.n)}"><button class="btn pri" data-a="rsalvar" data-s="${s.id}">Salvar</button><button class="btn" data-a="rcancel">Cancelar</button></div>`:`<span class="n">${esc(s.n)}</span>
 <span class="badge ${s.pad?"b-p":"b-e"}">${s.pad?"Padrão":"Escritório"}</span>${s.on?"":'<span class="badge b-i">Desativada</span>'}
 <span class="q">${s.arq} arquivo${s.arq==1?"":"s"}</span>
 <span class="acts">${s.pad?'<button title="Padrão do sistema">🔒</button>':`<button data-a="ren" data-s="${s.id}" title="Renomear">✏️</button><button data-a="tog" data-s="${s.id}" title="${s.on?"Desativar":"Reativar"}">${s.on?"⏸":"▶️"}</button><button data-a="del" data-s="${s.id}" title="Excluir">🗑</button>`}</span>`}</div>`).join(""):`<div class="empty">Esta categoria não tem subcategorias.<br>Os arquivos podem ser classificados só com a categoria.</div>`}`;
 const i=$("#ni")||$("#ri");i&&i.focus();
}
function logs(){$("#vl").innerHTML=L.slice().reverse().map(l=>`<div class="log">${esc(l.t)}<small>${l.u} · ${l.d}</small></div>`).join("")}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-c],[data-a],[data-t],#fEsc,#fDes,#bNova");if(!t)return;
 if(t.dataset.t){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x==t));const l=t.dataset.t=="l";$("#vc").style.display=l?"none":"flex";$("#vl").style.display=l?"block":"none";logs();return}
 if(t.dataset.c){sel=+t.dataset.c;novo=0;ren=null}
 if(t.id=="fEsc"){fE^=1;t.classList.toggle("on",!!fE)}
 if(t.id=="fDes"){fD^=1;t.classList.toggle("on",!!fD)}
 const c=C.find(x=>x.id==sel),s=c&&c.subs.find(x=>x.id==+t.dataset.s),a=t.dataset.a;
 if(t.id=="bNova"||a=="novo")novo=1;
 if(a=="cancel")novo=0;if(a=="rcancel")ren=null;if(a=="ren")ren=s.id;
 if(a=="salvar"||a=="rsalvar"){const v=(a=="salvar"?$("#ni"):$("#ri")).value.trim();if(!v)return snack("Informe o nome.");
  if(c.subs.some(x=>x!==s&&nm(x.n)==nm(v)))return snack("Já existe uma subcategoria com esse nome nesta categoria.");
  if(a=="salvar"){c.subs.push({id:++id,n:v,pad:0,on:1,arq:0});novo=0;L.push({t:`Criou a subcategoria “${v}” em ${c.n}`,u:"Você",d:"agora"});snack("Subcategoria criada.")}
  else{L.push({t:`Renomeou “${s.n}” para “${v}”`,u:"Você",d:"agora"});s.n=v;ren=null;snack("Renomeada.")}}
 if(a=="tog"){s.on^=1;L.push({t:`${s.on?"Reativou":"Desativou"} a subcategoria “${s.n}”`,u:"Você",d:"agora"});snack(s.on?"Reativada.":"Desativada. Arquivos já classificados continuam com ela.")}
 if(a=="del"){if(s.arq)return snack(`Não dá para excluir: ${s.arq} arquivo(s) usam esta subcategoria. Desative-a.`);if(!confirm(`Excluir “${s.n}”?`))return;c.subs=c.subs.filter(x=>x!==s);L.push({t:`Excluiu a subcategoria “${s.n}”`,u:"Você",d:"agora"});snack("Excluída.")}
 render();
});
document.addEventListener("keydown",e=>{if(e.key=="Enter"){const b=$("#ni")?'[data-a="salvar"]':$("#ri")?'[data-a="rsalvar"]':null;b&&$(b).click()}if(e.key=="Escape"){novo=0;ren=null;render()}});
$("#q").addEventListener("input",e=>{q=nm(e.target.value.trim());render()});
render();
</script></body></html>
