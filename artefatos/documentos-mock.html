            <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" data-cedit="${c.id}" aria-label="Editar ${esc(c.nome)}">${ic('edit',14)}</button><button type="button" class="btn btn-sm btn-danger rounded-pill" data-cdel="${c.id}" aria-label="Excluir ${esc(c.nome)}">${ic('trash',14)}</button>`}</div>
        ${o?`<div class="card-body d-flex flex-column gap-2"><div class="manage-sub manage-sub-head small text-secondary"><span>Peça / subcategoria</span><span>Palavras-chave (sugestões)</span><span>Arq.</span><span></span></div>${its.map(s=>`<div class="manage-sub"><input type="text" class="form-control form-control-sm" value="${esc(s.nome)}" data-sname="${s.id}" aria-label="Nome da peça"><input type="text" class="form-control form-control-sm" value="${esc(s.kw.join(', '))}" data-kw="${s.id}" aria-label="Palavras-chave de ${esc(s.nome)}"><span class="small text-secondary text-end tabular-nums">${countSub(s.id)}</span><button type="button" class="btn btn-sm btn-danger rounded-pill p-0 btn-icon" data-sdel="${s.id}" aria-label="Excluir ${esc(s.nome)}">${ic('trash',13)}</button></div>`).join('')}
          <div class="d-flex gap-2"><input type="text" class="form-control form-control-sm" placeholder="Nova peça em ${esc(c.nome)}" data-newsub="${c.id}" aria-label="Nova peça em ${esc(c.nome)}"><button type="button" class="btn btn-sm btn-success rounded-pill" data-addsub2="${c.id}">${ic('plus',12)}Adicionar</button></div></div>`:''}</div>`;}).join('');
    return `<div class="manage-top"><div class="manage-stats">${stat(CATS.length,'áreas')}${stat(SUBS.length,'peças')}${stat(files().length-pend,'classificados')}${stat(pend,'sem classificação',true)}</div>${pend?`<button type="button" class="btn btn-sm btn-primary rounded-pill" data-mgclassify>${ic('spark',14)}Classificar pendentes</button>`:''}</div>
      <div class="input-group"><span class="input-group-text">${ic('search',15)}</span><input type="text" class="form-control" id="tt-q" placeholder="Buscar área ou peça…" value="${esc(q)}" aria-label="Buscar classificação"></div>
      <div class="d-flex flex-column gap-2">${list||eAlert('light',{html:`Nada encontrado para “${esc(q)}”.`})}</div>
      <div class="card"><div class="card-header"><span class="card-title">Nova área (categoria)</span></div><div class="card-body d-flex flex-column gap-2">
        <div class="d-flex gap-2"><input type="text" class="form-control" id="nc-nome" placeholder="Ex.: Direito Previdenciário" value="${esc(preNome||'')}" aria-label="Nome da área"><input type="color" class="form-control form-control-color" id="nc-cor" value="${esc(chartColor(CATS.length))}" aria-label="Cor da área"></div>
        <input type="text" class="form-control" id="nc-subs" placeholder="Peças separadas por ponto e vírgula (ex.: Aposentadoria por idade; Auxílio-doença)" aria-label="Peças da nova área">
        <div><button type="button" class="btn btn-sm btn-success rounded-pill" id="nc-add">${ic('plus',13)}Cadastrar área</button></div></div></div>`;};
  const saveInputs=a=>{$$('[data-kw]',a.body).forEach(i=>{const s=SUBS.find(x=>x.id===i.dataset.kw);if(s)s.kw=i.value.split(',').map(x=>norm(x.trim())).filter(Boolean);});
    $$('[data-sname]',a.body).forEach(i=>{const s=SUBS.find(x=>x.id===i.dataset.sname);const v=i.value.trim();if(s&&v&&v!==s.nome&&!s.cat.itens.some(o=>o!==s&&norm(o.nome)===norm(v)))s.nome=v;});recalcIdf();};
  dialog({title:'Classificações',icon:'tag',wide:true,body:'',
    actions:[{label:'Fechar',fn:a=>{saveInputs(a);a.close();render();}},{label:'Salvar alterações',kind:'save',fn:a=>{saveInputs(a);a.close();toast('Classificações salvas — sugestões recalculadas',{kind:'ok'});render();}}],
    onMount:a=>{
      const paint=(keepQ)=>{saveInputs(a);a.body.innerHTML=body();bindQ();if(keepQ){const n=$('#tt-q');n.focus();n.setSelectionRange(q.length,q.length);}};
      const bindQ=()=>{$('#tt-q').oninput=e=>{q=e.target.value;paint(true);};};
      a.body.innerHTML=body();bindQ();if(preNome)setTimeout(()=>$('#nc-nome').focus(),50);
      a.body.addEventListener('click',async e=>{
        const t=e.target;
        if(t.closest('[data-mgclassify]')){saveInputs(a);a.close();render();dlgClassify();return;}
        const c=t.closest('[data-tcat]');if(c){open.has(c.dataset.tcat)?open.delete(c.dataset.tcat):open.add(c.dataset.tcat);paint();return;}
        const ce=t.closest('[data-cedit]');if(ce){editCat=ce.dataset.cedit;paint();setTimeout(()=>$(`[data-cname="${editCat}"]`)?.select(),0);return;}
        if(t.closest('[data-ccancel]')){editCat=null;paint();return;}
        const cs=t.closest('[data-csave]');if(cs){const cat=CATS.find(x=>x.id===cs.dataset.csave),n=$(`[data-cname="${cat.id}"]`).value.trim();if(!n)return;if(CATS.some(x=>x!==cat&&norm(x.nome)===norm(n))){toast('Já existe uma área com esse nome',{kind:'err'});return;}cat.nome=n;cat.cor=$(`[data-ccor="${cat.id}"]`).value;editCat=null;paint();toast('Área atualizada',{kind:'ok'});return;}
        const cd=t.closest('[data-cdel]');if(cd){const cat=CATS.find(x=>x.id===cd.dataset.cdel),n=countCat(cat);
          const ok=await confirmDlg({title:'Excluir área',icon:'trash',text:`Excluir <b>${esc(cat.nome)}</b> e suas ${cat.itens.length} peças?${n?` <b>${n} arquivo${n>1?'s':''}</b> ficarão sem classificação.`:''}`,ok:'Excluir área',danger:true});
          if(!ok){dlgTipos();return;}cat.itens.slice().forEach(removeSub);CATS.splice(CATS.indexOf(cat),1);toast('Área excluída',{kind:'ok'});render();dlgTipos();return;}
        const sd=t.closest('[data-sdel]');if(sd){saveInputs(a);const s=SUBS.find(x=>x.id===sd.dataset.sdel),n=countSub(s.id);
          if(n){const ok=await confirmDlg({title:'Excluir peça',icon:'trash',text:`Excluir <b>${esc(s.nome)}</b>? <b>${n} arquivo${n>1?'s':''}</b> ficarão sem classificação.`,ok:'Excluir',danger:true});if(!ok){dlgTipos();return;}removeSub(s);render();dlgTipos();toast('Peça excluída',{kind:'ok'});return;}
          removeSub(s);paint();toast('Peça excluída',{kind:'ok'});return;}
        const ad=t.closest('[data-addsub2]');if(ad){const cat=CATS.find(x=>x.id===ad.dataset.addsub2),inp=$(`[data-newsub="${cat.id}"]`,a.body),n=inp.value.trim();if(!n)return;if(cat.itens.some(s=>norm(s.nome)===norm(n))){toast('Essa peça já existe nesta área',{kind:'err'});return;}saveInputs(a);addSub(cat,n);recalcIdf();open.add(cat.id);paint();toast(`“${esc(n)}” adicionada em ${esc(cat.nome)}`,{kind:'ok'});return;}
        if(t.closest('#nc-add')){const n=$('#nc-nome').value.trim();if(!n)return;if(CATS.some(x=>norm(x.nome)===norm(n))){toast('Essa área já existe',{kind:'err'});return;}saveInputs(a);
          const cat={id:'c'+Date.now(),nome:n,cor:$('#nc-cor').value,ic:'folder',itens:[]};CATS.splice(CATS.length-1,0,cat);
          $('#nc-subs').value.split(';').map(x=>x.trim()).filter(Boolean).forEach(x=>addSub(cat,x));recalcIdf();open.add(cat.id);preNome='';paint();toast(`Área “${esc(n)}” cadastrada`,{kind:'ok'});}});
      a.body.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-newsub]')){e.preventDefault();$(`[data-addsub2="${e.target.dataset.newsub}"]`).click();}});}});
}
</script>
<script>
'use strict';
/* =====================================================================
   10. DOCUMENTO ABERTO — drawer lateral 50% (desktop) / tela cheia (tablet e celular)
   ===================================================================== */
const PNL={item:null,tab:'detalhes',prev:null};
function openPanel(f,tab='detalhes'){
  if(!f||f.type!=='file')return;
  closeMenu();closeDialog();closeQL();
  if(PNL.item!==f)access(f,'visualizado');
  PNL.item=f;PNL.tab=tab;PNL.prev=PNL.prev||document.activeElement;renderPanel();
  const x=$('#pnl-x');if(x)x.focus();
}
function closePanel(){PNL.item=null;$('#panel').innerHTML='';const p=PNL.prev;PNL.prev=null;if(p&&p.focus&&document.body.contains(p))p.focus();}
function tipoField(f,inTrash){const t=tipoById(f.tipo),s=f.tipo?null:sugerirTipos(f)[0];
  return `<span class="meta-value">${pickerTrigger(t,`data-pa="settipo" ${inTrash?'disabled':''}`)}${s?`<button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" data-sgt="${s.tipo}">${ic('spark',12)}Usar sugestão: ${esc(curto(tipoById(s.tipo).nome))} ${confBadge(s.conf)}</button>`:''}</span>`;}
const statusSelect=(f,inTrash)=>`<select class="form-select form-select-sm" data-pa-status aria-label="Status" ${inTrash?'disabled':''}><option value="">Sem status</option>${Object.entries(STATUS).map(([k2,v])=>`<option value="${k2}" ${f.status===k2?'selected':''}>${v}</option>`).join('')}</select>`;
const ocrBadge=f=>f.ocr==='ok'?badge('positive','Concluído'):f.ocr==='proc'?`<span class="badge badge-info"><span class="spinner-border"></span>Processando</span>`:badge('secondary','Não se aplica');
const detailRows=(f,inTrash)=>`${metaRows(f)}<tr><td>Classificação</td><td>${tipoField(f,inTrash)}</td></tr><tr><td>Processo</td><td>${f.proc?`<span class="tabular-nums">${esc(f.proc)}</span>`:'—'}</td></tr>
  <tr><td>Status</td><td>${statusSelect(f,inTrash)}</td></tr><tr><td>Prazo</td><td>${f.deadline!=null?badge(SEV_BADGE[deadlineInfo(f.deadline).sev],deadlineInfo(f.deadline).rot):'—'}</td></tr>`;
const accessList=(rows,withFile)=>`<div class="list-group">${rows.map(({f,a})=>`<div class="list-group-item"><span class="section-icon">${ic(a.tipo==='baixado'?'download':'eye',15)}</span><div class="flex-fill"><b>${esc(USERS[a.user].nome)}</b> ${a.tipo==='baixado'?'baixou':'visualizou'}${withFile?` <button type="button" class="btn btn-link btn-sm p-0" data-logopen="${f.id}">${esc(f.name)}</button>`:''}${a.audit?' '+badge('info','Auditoria financeira'):''}<span class="d-block small text-secondary">${fmtDate(a.date)} · IP ${a.ip}</span></div></div>`).join('')}</div>`;
const favBtn=(f,sz)=>`<button type="button" class="btn btn-icon ${f.fav?'text-primary':''}" data-pa="fav" aria-pressed="${f.fav}" aria-label="${f.fav?'Remover dos favoritos':'Adicionar aos favoritos'}">${ic('star',sz)}</button>`;
/* Tablet/celular: tela cheia, documento primeiro, informações abaixo, ações fixas no rodapé */
function renderMobileViewer(){
  const f=PNL.item,el=$('#panel'),inTrash=TRASH.some(t=>t.item===f),m=isMergeable(f);
  const sc=$('.doc-viewer-scroll'),scroll=sc?sc.scrollTop:0;
  const evs=EVENTS.filter(e=>e.item===f).sort((a,b)=>b.date-a.date);
  const pages=Math.max(1,Math.ceil(f.size/400000));
  const det=(icn,title,content)=>`<details class="card"><summary class="card-header"><span class="text-secondary d-flex">${ic(icn,15)}</span><span class="card-title flex-fill">${title}</span><span class="chevron d-flex">${ic('chevDown',16)}</span></summary><div class="card-body">${content}</div></details>`;
  const btn=(k,icn,l,cls='btn-outline-secondary',dis=false)=>`<button type="button" class="btn ${cls}" data-pa="${k}" ${dis?'disabled':''}>${ic(icn,20)}${l}</button>`;
  el.innerHTML=`<div class="drawer drawer-end doc-viewer" role="dialog" aria-modal="true" aria-label="Documento ${esc(f.name)}">
    <header class="doc-viewer-head border-bottom"><button type="button" class="btn btn-icon" data-pclose id="pnl-x" aria-label="Voltar">${ic('back',22)}</button>
      <div class="flex-fill"><span class="card-title d-block text-truncate">${esc(f.name)}</span><span class="small text-secondary d-block text-truncate">${esc(f.ext)} · ${fmtSize(f.size)} · ${esc(locationOf(f))}</span></div>
      ${inTrash?'':favBtn(f,21)}<button type="button" class="btn btn-icon" data-pa="more" aria-label="Mais ações">${ic('more',22)}</button></header>
    <div class="doc-viewer-scroll">
      <div class="doc-viewer-doc file-list-item-thumb">${pagesHTML(f)}<div class="small text-secondary text-center mt-2">Página 1 de ${pages} · role para ver as informações</div></div>
      <div class="doc-viewer-info">
        ${badges(f)}
        <section class="card"><div class="card-header"><span class="text-secondary d-flex">${ic('file',15)}</span><span class="card-title">Detalhes</span></div><div class="card-body"><table class="table"><tbody>${detailRows(f,inTrash)}</tbody></table></div></section>
        ${det('spark',`Texto reconhecido (OCR) ${ocrBadge(f)}`,`<div class="ocr-text">${f.ocr==='proc'?'Aguardando processamento…':esc(f.text||'Nenhum texto encontrado neste arquivo.')}</div>`)}
        ${det('history',`Histórico (${evs.length})`,eventsHTML(evs,true))}
        ${det('shield',`Acessos (${f.access.length})`,accessList(f.access.slice().sort((a,b)=>b.date-a.date).map(a=>({f,a})),false))}
      </div>
    </div>
    <nav class="doc-viewer-actions border-top" aria-label="Ações do documento">${inTrash
      ?btn('restore','restore','Restaurar','btn-success')+btn('purge','trash','Excluir definitivamente','btn-danger')
      :btn('download','download','Baixar','btn-primary')+btn('compress','compress','Comprimir','btn-outline-secondary',!m)+btn('merge','merge','Unir','btn-outline-secondary',!m)+btn('move','move','Mover')+btn('trash','trash','Excluir','btn-danger')}</nav></div>`;
  const ns=$('.doc-viewer-scroll');if(ns)ns.scrollTop=scroll;
}
function renderPanel(){
  const f=PNL.item,el=$('#panel');if(!f){el.innerHTML='';return;}
  if(isT())return renderMobileViewer();
  const inTrash=TRASH.some(t=>t.item===f),m=isMergeable(f);
  const scroll=$('.doc-drawer-body')?$('.doc-drawer-body').scrollTop:0;
  const b=(k,icn,l,cls='btn-outline-secondary',extra='')=>`<button type="button" class="btn btn-sm rounded-pill ${cls}" data-pa="${k}" ${extra}>${ic(icn,14)}${l}</button>`;
  const acts=inTrash?b('restore','restore','Restaurar','btn-success')+b('purge','trash','Excluir definitivamente','btn-danger')
   :b('sign','sign',`Assinar ${badge('secondary','Em breve')}`,'btn-outline-secondary','disabled title="Integração de assinatura em definição"')
    +b('compress','compress','Comprimir','btn-outline-secondary',m?'':'disabled title="Disponível para PDFs/imagens"')+b('merge','merge','Unir com…','btn-outline-secondary',m?'':'disabled title="Disponível para PDFs/imagens"')
    +b('download','download','Baixar')+b('move','move','Mover')+b('rename','edit','Renomear')+b('trash','trash','Excluir','btn-danger ms-auto');
  const evs=EVENTS.filter(e=>e.item===f).sort((a,b)=>b.date-a.date);
  let body='';
  if(PNL.tab==='detalhes'){
    body=`<table class="table"><tbody>${detailRows(f,inTrash)}</tbody></table>
      <div class="d-flex align-items-center gap-2 mt-3 mb-2"><span class="card-title">Texto reconhecido (OCR)</span>${ocrBadge(f)}</div>
      ${f.ocr==='na'?eAlert('light',{html:'O texto de documentos Word/Excel é extraído diretamente do arquivo, sem OCR.'}):''}<div class="ocr-text text-secondary mt-2">${f.ocr==='proc'?'Aguardando processamento…':esc(f.text||'Nenhum texto encontrado neste arquivo.')}</div>`;
  }else if(PNL.tab==='historico'){
    body=evs.length?eventsHTML(evs,true):eAlert('light',{html:'Sem eventos.'});
  }else{
    const fin=pathOf(f)[0]===ROOT.fin;
    body=eAlert('info',{icone:'shield',html:`Toda visualização e download é registrado com usuário, data, hora e IP.${fin?' Downloads desta área geram também registro de <b>auditoria financeira</b>.':''}`})+accessList(f.access.slice().sort((a,b)=>b.date-a.date).map(a=>({f,a})),false);
  }
  const tabs=[['detalhes','Detalhes'],['historico','Histórico'],['acessos','Acessos']];
  el.innerHTML=`<div class="drawer-backdrop" data-pclose></div><aside class="drawer drawer-end doc-drawer" role="dialog" aria-modal="true" aria-label="Documento ${esc(f.name)}">
    <header class="doc-drawer-head border-bottom"><span class="section-icon">${ic(KICON[kind(f.ext)],18)}</span><div class="flex-fill"><span class="card-title d-block text-truncate">${esc(f.name)}</span><span class="small text-secondary d-block text-truncate">${esc(locationOf(f))} · ${fmtSize(f.size)}</span></div>
    ${inTrash?'':favBtn(f,18)}<button type="button" class="btn-close" id="pnl-x" data-pclose aria-label="Fechar">${ic('x',16)}</button></header>
    <div class="doc-drawer-viewer file-list-item-thumb">${pagesHTML(f)}</div>
    <div class="doc-drawer-actions border-top border-bottom">${acts}</div>
    <div class="doc-drawer-body"><div class="card"><div class="card-header"><ul class="nav nav-tabs card-header-tabs" role="tablist">${tabs.map(([k2,l])=>`<li class="nav-item" role="presentation"><button type="button" class="nav-link ${PNL.tab===k2?'active':''}" role="tab" aria-selected="${PNL.tab===k2}" data-ptab="${k2}">${l}</button></li>`).join('')}</ul></div>
    <div class="card-body" role="tabpanel">${body}</div></div></div></aside>`;
  const bd=$('.doc-drawer-body');if(bd)bd.scrollTop=scroll;
}
$('#panel').addEventListener('click',e=>{
  const f=PNL.item;if(!f)return;
  if(e.target.closest('[data-pclose]'))return closePanel();
  const t=e.target.closest('[data-ptab]');if(t){PNL.tab=t.dataset.ptab;renderPanel();return;}
  const g=e.target.closest('[data-goto]');if(g){closePanel();revealFile(f);return;}
  const sg=e.target.closest('[data-sgt]');if(sg){f.tipo=sg.dataset.sgt;usarTipo(f.tipo);log('tipado',f,curto(tipoById(f.tipo).nome)+' (sugestão)');toast('Classificação salva',{kind:'ok'});render();return;}
  const a=e.target.closest('[data-pa]');if(!a)return;
  if(a.dataset.pa==='more'){const r=a.getBoundingClientRect();openMenu(menuFor(f).filter(x=>x==='-'||!['Abrir','Visualização rápida'].includes(x.t)).filter((x,i)=>!(x==='-'&&i===0)),f.name,r.right,r.bottom);return;}
  ({restore:()=>{doRestore([f]);closePanel();},purge:()=>doPurge([f]),compress:()=>dlgCompress([f]),merge:()=>dlgMerge([f],true),download:()=>doDownload([f]),
    move:()=>dlgMove([f]),rename:()=>dlgRename(f),trash:()=>doTrash([f]),settipo:()=>dlgSetTipo([f]),fav:()=>toggleFav(f),sign:()=>dlgSign()})[a.dataset.pa]?.();
});
$('#panel').addEventListener('change',e=>{const s=e.target.closest('[data-pa-status]');if(!s)return;const f=PNL.item;f.status=s.value||null;log('status_alterado',f,s.value?STATUS[s.value]:'Sem status');toast('Status atualizado',{kind:'ok'});render();});

/* =====================================================================
   11. VISUALIZAÇÃO RÁPIDA (Grid: Visualizar / duplo clique / Espaço) — modal
   ===================================================================== */
let QL=null;
function quickLook(f){
  if(!f||f.type!=='file')return;closeQL();closeMenu();
  access(f,'visualizado');
  const b=document.createElement('div');b.className='modal';
  b.innerHTML=`<div class="modal-dialog modal-xl"><div class="modal-content" role="dialog" aria-modal="true" aria-label="Visualização rápida de ${esc(f.name)}"><div class="modal-header"><span class="modal-title text-truncate">${esc(f.name)}</span><button type="button" class="btn-close" data-qx aria-label="Fechar">${ic('x',16)}</button></div>
    <div class="quicklook"><div class="quicklook-doc file-list-item-thumb">${pagesHTML(f)}</div>
    <div class="quicklook-side border-start">${badges(f)}${metaHTML(f)}
    <div class="d-flex flex-column gap-2 mt-3"><button type="button" class="btn btn-primary rounded-pill" data-qo>${ic('open',14)}Abrir</button><button type="button" class="btn btn-outline-secondary rounded-pill" data-qd>${ic('download',14)}Baixar</button></div></div></div></div></div>`;
  b.addEventListener('mousedown',e=>{if(e.target===b)closeQL();});
  b.addEventListener('click',e=>{if(e.target.closest('[data-qx]'))closeQL();else if(e.target.closest('[data-qo]')){closeQL();openPanel(f);}else if(e.target.closest('[data-qd]'))doDownload([f]);else if(e.target.closest('[data-goto]')){closeQL();revealFile(f);}});
  $('#layer').appendChild(b);QL={el:b,prev:document.activeElement};$('[data-qx]',b).focus();
}
function closeQL(){if(!QL)return;QL.el.remove();const p=QL.prev;QL=null;if(p&&p.focus&&document.body.contains(p))p.focus();}

/* =====================================================================
   12. UPLOAD (botão Novo, arrastar do computador)
   ===================================================================== */
const UP={list:[],min:false,dest:null};
function pickUpload(dest){UP.dest=dest;$('#file-in').value='';$('#file-in').click();}
$('#file-in').addEventListener('change',e=>{if(e.target.files.length)startUpload([...e.target.files],UP.dest||cur());});
function startUpload(files,dest){
  if(!dest||dest.virtual){dest=ROOT.meus;toast('Esta área é automática — arquivos enviados para <b>Meus documentos</b>');}
  UP.min=false;
  files.forEach(file=>{
    const u={id:'u'+Math.random().toString(36).slice(2),name:file.name,size:file.size,prog:0,err:'',done:false,dest};
    UP.list.push(u);
    if(file.size>MAX_UPLOAD){u.err=`Arquivo acima de ${fmtSize(MAX_UPLOAD)}`;return;}
    if(!/\.[a-z0-9]{2,5}$/i.test(file.name)){u.err='Tipo de arquivo não reconhecido';return;}
    const t=setInterval(()=>{u.prog=Math.min(100,u.prog+8+Math.random()*20);
      if(u.prog>=100){clearInterval(t);u.done=true;
        const name=uniqueName(dest,file.name);
        const nf=fi(name,Math.max(1,file.size/1024),0,{proc:procFolderOf(dest)?.proc||null});nf.mtime=new Date();
        const needOcr=['pdf','img'].includes(kind(nf.ext));nf.ocr=needOcr?'proc':'na';
        if(!needOcr)nf.text=name.replace(/\.[^.]+$/,'');
        dest.children.push(nf);link(nf,dest,dest.area);log('upload',nf);

let stChart=null,stSig='',SIM=null;
function storageData(){
  if(S.stMode==='area'){
    const rows=AREAS.filter(a=>!a.calc).map(a=>({nome:a.nome,pal:a.pal,b:allFiles(a.k).reduce((s,f)=>s+f.size,0)}));
    rows.push({nome:'Lixeira',pal:7,b:TRASH.reduce((s,t)=>{let x=0;walk(t.item,n=>{if(n.type==='file')x+=n.size;});return s+x;},0)});
    return rows.filter(r=>r.b>0).sort((a,b)=>b.b-a.b);
  }
  const g={pdf:{nome:'PDFs',pal:5,b:0},docx:{nome:'Documentos',pal:2,b:0},xlsx:{nome:'Planilhas',pal:4,b:0},img:{nome:'Imagens',pal:3,b:0},outro:{nome:'Outros',pal:7,b:0}};
  allFiles().forEach(f=>g[kind(f.ext)].b+=f.size);
  TRASH.forEach(t=>walk(t.item,n=>{if(n.type==='file')g[kind(n.ext)].b+=n.size;}));
  return Object.values(g).filter(r=>r.b>0).sort((a,b)=>b.b-a.b);
}
function renderStorage(){
  const d=storageData(),total=d.reduce((s,r)=>s+r.b,0),p=SIM??total/LIMIT*100;

    tooltip:{trigger:'item',backgroundColor:tok('--chart-tooltip-bg'),borderWidth:0,textStyle:{color:tok('--chart-tooltip-text-color'),fontSize:12},formatter:q=>`<b>${q.seriesName}</b><br>${fmtSize(q.value)} · ${Math.round(q.value/total*100)}%`},
    grid:{left:0,right:0,top:4,bottom:4},xAxis:{type:'value',max:total,show:false},yAxis:{type:'category',data:['uso'],show:false},
    series:d.map((r,i)=>{const c=chartColor(r.pal-1);return {type:'bar',name:r.nome,stack:'uso',barWidth:14,data:[r.b],
      itemStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:c},{offset:1,color:c+'cc'}]),borderColor:tok('--color-primary-lightest'),borderWidth:1.5,

    if(S.sel.size){S.sel.clear();S.selFile=null;render();return;}
  }
  /* Elementos não nativos com clique: Enter/Espaço acionam (resultados da busca e cartões com role="button") */
  if((e.key==='Enter'||e.key===' ')&&!typing(e)&&e.target.matches&&e.target.matches('[data-sr],[role="button"]')){e.preventDefault();e.target.click();return;}
  if(QL&&e.key===' '&&!typing(e)){e.preventDefault();closeQL();return;}
  if(DLG||QL||MENU||POP||PNL.item)return;
  if(typing(e))return;
  if(e.key==='/'){e.preventDefault();isM()?openMSearch():$('#q').focus();return;}
  if(S.q||(S.tab==='timeline'&&inProcess()))return;
  const it=cursorItem();
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();const list=S.view==='list'&&!isT()?(COLS[COLS.length-1]||[]):GRID;S.sel=new Set(list.map(x=>x.id));S.selFile=null;render();return;}
  if(e.key==='ContextMenu'||(e.shiftKey&&e.key==='F10')){if(!it)return;e.preventDefault();const el=$(`#view [data-id="${it.id}"]`);const r=el?el.getBoundingClientRect():{right:400,bottom:300};menuForItem(it,r.right,r.bottom);return;}
  if(!it&&['ArrowDown','ArrowRight'].includes(e.key)){const list=S.view==='list'&&!isT()?COLS[0]:GRID;if(list&&list[0]){e.preventDefault();const el=$(`#view [data-id="${list[0].id}"]`);clickItem(list[0],el,{});}return;}
  if(!it)return;
  if(e.target.closest&&e.target.closest('button,a')&&e.key!=='F2'&&e.key!=='Delete')return;
  if(e.key==='Enter'){e.preventDefault();if(it.type==='folder')goFolder(it);else if(!TRASH.some(t=>t.item===it))openPanel(it);return;}
  if(e.key===' '){e.preventDefault();if(it.type==='file')quickLook(it);return;}
  if(e.key==='F2'){e.preventDefault();if(S.area!=='lix')startRename(it);return;}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();const items=S.sel.size>1?selItems():[it];S.area==='lix'?doPurge(items):doTrash(items);return;}
  if(S.view==='list'&&!isT()){
    const ci=S.path.indexOf(it.parent)>=0?S.path.indexOf(it.parent):S.path.length-1;const list=COLS[ci]||[];const i=list.indexOf(it);
    const go=n=>{if(!n)return;e.preventDefault();clickItem(n,$(`#view [data-id="${n.id}"]`)||{dataset:{col:ci}},{});setTimeout(()=>{const el=$(`#view [data-id="${n.id}"]`);if(el){el.scrollIntoView({block:'nearest'});el.focus();}},0);};
    if(e.key==='ArrowDown')go(list[i+1]);
    if(e.key==='ArrowUp')go(list[i-1]);
    if(e.key==='ArrowRight'&&it.type==='folder'){const kids=visibleChildren(it);if(kids[0]){e.preventDefault();setTimeout(()=>{clickItem(kids[0],{dataset:{col:ci+1}},{});},300);}}
    if(e.key==='ArrowLeft'&&ci>0){e.preventDefault();const p=S.path[ci];S.path=S.path.slice(0,ci);clickItem(p,{dataset:{col:ci-1}},{});}
    return;
  }
  const i=GRID.indexOf(it);if(i<0)return;
  const cards=$$('#gridEl .grid-item');const cols=cards.length?cards.filter(c=>c.offsetTop===cards[0].offsetTop).length:1;
  const to={ArrowRight:i+1,ArrowLeft:i-1,ArrowDown:i+(S.view==='grid'?cols:1),ArrowUp:i-(S.view==='grid'?cols:1)}[e.key];
  if(to!=null&&GRID[to]){e.preventDefault();selectOnly(GRID[to]);render();$(`#view [data-id="${GRID[to].id}"]`)?.focus();}
});

/* =====================================================================
   15b. CELULAR — barra de app no topo, busca, seleção por toque longo (sem barra inferior)
   ===================================================================== */
let LP=null,LPfired=false;
$('#view').addEventListener('pointerdown',e=>{
  if(!isM()||S.renaming||e.button>0)return;const h=itemFromEvent(e);if(!h||e.target.closest('[data-act]'))return;
  LPfired=false;clearTimeout(LP);const x=e.clientX,y=e.clientY;
  LP=setTimeout(()=>{LPfired=true;S.selMode=true;S.sel.add(h.it.id);S.selFile=null;try{navigator.vibrate&&navigator.vibrate(12);}catch(_){}render();},480);
  const stop=ev=>{if(ev.type==='pointermove'&&Math.hypot(ev.clientX-x,ev.clientY-y)<8)return;clearTimeout(LP);['pointermove','pointerup','pointercancel'].forEach(t=>window.removeEventListener(t,stop));};
  ['pointermove','pointerup','pointercancel'].forEach(t=>window.addEventListener(t,stop));
});
$('#view').addEventListener('click',e=>{if(LPfired){LPfired=false;e.stopPropagation();e.preventDefault();}},true);
function openMSearch(){$('#device').classList.add('msearch');setTimeout(()=>$('#q').focus(),0);}
function closeMSearch(){$('#device').classList.remove('msearch');$('#q').value='';syncQ();S.q='';render();}
$('#q-cancel').onclick=closeMSearch;
$('#cam-in').addEventListener('change',e=>{if(e.target.files.length)startUpload([...e.target.files],cur().virtual?ROOT.meus:cur());});
function mFolderMenu(x,y){
  const f=cur();
  const items=S.area==='lix'?[{ic:'trash',t:'Esvaziar lixeira',danger:true,dis:!TRASH.length,fn:()=>emptyTrash()}]:[
    {ic:S.view==='list'?'grid':'list',t:S.view==='list'?'Ver em grade':'Ver em lista',fn:()=>{S.view=S.view==='list'?'grid':'list';store.set('view',S.view);render();}},
    {ic:'check',t:'Selecionar itens',fn:()=>{S.selMode=true;S.sel.clear();render();}},{ic:'tag',t:'Classificações',fn:()=>dlgTipos()},'-',
    {ic:'shield',t:'Registro de acessos',fn:dlgLogs}];
  openMenu(items,f.isRoot?areaOf(S.area).nome:f.name,x,y);
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(!a||e.target.closest('#view [data-id]'))return;
  const k=a.dataset.act;
  if(k==='m-back'){S.path.pop();S.sel.clear();S.selFile=null;if(!inProcess())S.tab='arquivos';render();return;}
  if(k==='open-side'){$('#device').classList.add('side-open');if(stChart)setTimeout(()=>stChart.resize(),260);return;}
  if(k==='m-search')return openMSearch();
  if(k==='m-more'){const r=a.getBoundingClientRect();return mFolderMenu(r.right,r.bottom);}
  if(k==='sel-cancel'){S.selMode=false;S.sel.clear();render();return;}
  if(k==='sel-all'){S.sel=new Set(GRID.map(x=>x.id));render();return;}
});

/* =====================================================================
   15. RESPONSIVIDADE — desktop / tablet (≤1024) / celular (≤768)
   ===================================================================== */
let PREVIEW='auto';
function closeSide(){$('#device').classList.remove('side-open');}
$('#btn-menu').onclick=()=>$('#device').classList.toggle('side-open');
$('#side-back').onclick=closeSide;
function applyDevice(){
  const dev=$('#device'),w=PREVIEW==='mobile'?390:PREVIEW==='tablet'?820:window.innerWidth;
  const wasM=dev.classList.contains('m'),wasT=dev.classList.contains('t');
  dev.classList.toggle('t',w<=1024);dev.classList.toggle('m',w<=768);
  document.body.classList.toggle('framed',PREVIEW!=='auto');
  if(w>1024)closeSide();
  if(wasM!==dev.classList.contains('m')||wasT!==dev.classList.contains('t')){closeMenu();closePop();return true;}
  return false;
}
let rzT=null;
window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(applyDevice())render();if(stChart)stChart.resize();},120);});
$$('.pv [data-pv]').forEach(b=>b.onclick=()=>{PREVIEW=b.dataset.pv;$$('.pv [data-pv]').forEach(x=>x.classList.toggle('on',x===b));applyDevice();render();setTimeout(()=>stChart&&stChart.resize(),50);});

/* =====================================================================
   16. INICIALIZAÇÃO — abre em Meus documentos › Modelos de peças › Cível › Cobrança
   ===================================================================== */
(function init(){
  $('#ico-search').innerHTML=ic('search',17);$('#q-clear').innerHTML=ic('x',14);$('#btn-menu').innerHTML=ic('menu',20);
  $('#new-ic').innerHTML=ic('plus',13,3);$('#btn-logs').innerHTML=ic('shield',15)+'Registro de acessos';$('#dfx-ic').innerHTML=ic('upload',20);
  applyDevice();
  const mod=ROOT.meus.children.find(c=>c.name==='Modelos de peças');
  const civ=mod.children.find(c=>c.name==='Cível'),cob=civ.children.find(c=>c.name==='Cobrança');
  S.path=[ROOT.meus,mod,civ,cob];
  const pet=cob.children.find(c=>c.name.startsWith('Modelo — Petição'));selectOnly(pet);
  syncQ();render();
})();
</script>
