.file-list-item{background:var(--file-list-item-bg);color:var(--file-list-item-text-color);border:1px solid transparent;cursor:pointer;transition:background-color .15s,border-color .15s}
.file-list-item:hover{background:var(--file-list-item-hover-bg)}
.file-list-item.active{background:var(--file-list-item-active-bg);border-color:var(--file-list-item-active-border-color)}
.file-list-item.is-drop-target{border-color:var(--file-list-item-drop-border-color);border-style:dashed}
.file-list-item-thumb{background:var(--file-list-item-thumb-bg)}
/* forms */
.form-label{display:block;font-size:13px;font-weight:600;color:var(--input-label-color);margin-bottom:6px}
.form-control,.form-select{width:100%;border:1px solid var(--input-border-color);border-radius:8px;background:var(--input-bg);color:var(--input-text-color);padding:8px 11px;font:inherit;font-size:14px;outline:none;transition:border-color .15s}
.form-control::placeholder{color:var(--input-placeholder-color)}
.form-control:focus,.form-select:focus{border-color:var(--input-focus-border-color)}
.form-control.is-invalid{border-color:var(--input-error-color)}
.form-control-sm,.form-select-sm{padding:5px 9px;font-size:13px}
.form-control-color{width:44px;padding:3px;height:36px}
.form-select{text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px}
.form-text{font-size:12px;color:var(--text-color-secondary)}
.invalid-feedback{font-size:12px;color:var(--input-error-color);font-weight:600}
.input-group{display:flex;align-items:center;border:1px solid var(--input-border-color);border-radius:999px;background:var(--input-bg);padding:0 6px 0 14px;gap:8px;transition:border-color .15s}

.input-group-text{display:inline-flex;color:var(--text-color-secondary)}
.form-check{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background-color .15s}
.form-check:hover{background:var(--dropdown-item-hover-bg)}
.form-check-input{accent-color:var(--input-checkbox-checked-bg);width:16px;height:16px;margin:0}
/* listas e tabelas */
.list-group{display:flex;flex-direction:column}
.list-group-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-color)}
.list-group-item:last-child{border-bottom:none}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{font-size:12px;text-transform:uppercase;color:var(--text-color-secondary);font-weight:600;text-align:left;padding:7px 0;border-bottom:1px solid var(--border-color)}

.table td:first-child{text-align:left;color:var(--text-color-secondary)}

.breadcrumb-item.active{color:var(--text-color);font-weight:600;padding:4px 6px}
/* skeleton */
.skeleton-row{height:30px;margin:4px 2px}.skeleton-card{height:268px;border-radius:var(--card-border-radius)}.skeleton-line{height:12px}.w-70{width:70%}.w-40{width:40%}
.skeleton{border-radius:8px;background:linear-gradient(90deg,var(--skeleton-bg),var(--skeleton-highlight),var(--skeleton-bg));background-size:200% 100%;animation:skeleton 1.1s infinite}
@keyframes skeleton{to{background-position:-200% 0}}
/* snackbar (MatSnackBar + snackBarComponent) */
.snackbar-container{position:fixed;top:16px;right:16px;z-index:1300;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.snackbar{pointer-events:auto;background:var(--snackbar-bg);color:var(--snackbar-text-color);border-radius:12px;padding:10px 12px 10px 14px;display:flex;align-items:flex-start;gap:10px;max-width:420px;font-size:14px;animation:fade-in-up .2s ease}

.snackbar-success .snackbar-icon{color:var(--snackbar-success-icon-color)}.snackbar-error .snackbar-icon{color:var(--snackbar-error-icon-color)}.snackbar-warning .snackbar-icon{color:var(--snackbar-warning-icon-color)}.snackbar-info .snackbar-icon{color:var(--snackbar-info-icon-color)}
.snackbar-title{display:block;font-family:var(--font-head);font-weight:700}
.snackbar .btn{color:var(--snackbar-text-color);border-color:var(--snackbar-text-color)}
/* e-card (listagem móvel) */
.e-card{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--card-bg);border:1px solid var(--card-border-color);cursor:pointer;transition:transform .12s,background-color .15s,border-color .15s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* gráfico: amostra de cor da legenda */
.chart-swatch{width:9px;height:9px;border-radius:3px;display:inline-block;flex-shrink:0}
.chart-color-1{background:var(--chart-color-1)}.chart-color-2{background:var(--chart-color-2)}.chart-color-3{background:var(--chart-color-3)}.chart-color-4{background:var(--chart-color-4)}
.chart-color-5{background:var(--chart-color-5)}.chart-color-6{background:var(--chart-color-6)}.chart-color-7{background:var(--chart-color-7)}.chart-color-8{background:var(--chart-color-8)}
/* barra de lote (componente existente de Tarefas) */
.batch-bar{display:flex;align-items:center;gap:4px;background:var(--batch-bar-bg);color:var(--batch-bar-text-color);border-radius:16px;padding:8px 8px 8px 16px}

/* Sidebar — EXCEÇÃO SOLICITADA: visual anterior mantido (proposta de evolução do UI-Kit). Só tokens do tema. */
.pal-1{--c:var(--chart-color-1)}.pal-2{--c:var(--chart-color-2)}.pal-3{--c:var(--chart-color-3)}.pal-4{--c:var(--chart-color-4)}.pal-5{--c:var(--chart-color-5)}.pal-6{--c:var(--chart-color-6)}.pal-7{--c:var(--chart-color-7)}.pal-8{--c:var(--chart-color-8)}

.stc.alert{background:var(--color-negative-lightest);border-color:oklch(from var(--color-negative) l c h / .35);display:block;padding:16px;border-radius:16px}
.st-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.st-used{font-family:var(--font-head);font-size:24px;font-weight:600;color:var(--color-primary-darken);line-height:1;white-space:nowrap}
.st-used small{font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--text-color-secondary);margin-left:4px}
.st-pct{font-size:12px;font-weight:700;color:var(--text-color-readable);background:var(--color-white);border:1px solid var(--color-primary-lighten);padding:3px 9px;border-radius:999px;white-space:nowrap}
.stc.alert .st-pct{color:var(--color-negative)}
.st-seg{display:flex;background:var(--color-white);border:1px solid var(--color-primary-lighten);border-radius:999px;padding:3px;margin-bottom:4px}
.st-seg button{flex:1;border:none;background:transparent;font-size:12px;font-weight:600;color:var(--text-color-secondary);padding:5px 0;border-radius:999px;cursor:pointer;transition:background-color var(--input-switch-transition-duration) var(--input-switch-transition-easing)}
.st-seg button.on{background:var(--color-primary);color:var(--color-white)}
.st-chart{width:100%;height:26px;margin:6px 0 8px}
.st-types{display:flex;flex-wrap:wrap;gap:5px 12px;margin:0 2px;font-size:12px;color:var(--color-slate-700)}
.st-types span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.st-types em{font-style:normal;color:var(--text-color-secondary)}
.acc{border:1px solid var(--color-slate-200);border-radius:16px;background:var(--color-white);display:flex;flex-direction:column;min-height:0}
.acc-h{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;padding:11px 12px;text-align:left;border-radius:16px;cursor:pointer;transition:background-color .15s}
.acc-h:hover{background:var(--color-slate-100)}
.acc-h .ai{width:30px;height:30px;border-radius:9px;background:var(--color-primary-lightest);color:var(--color-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acc-h b{display:block;font-size:14px;color:var(--text-color)}
.acc-h small{font-size:12px;color:var(--text-color-secondary)}
.acc-h .chv{margin-left:auto;display:flex;color:var(--text-color-secondary);transition:transform .25s}
.acc.open .acc-h .chv{transform:rotate(180deg)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,.8,.2,1);min-height:0}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-b>div{overflow:hidden;min-height:0}
.acc.open .acc-b>div{overflow-y:auto;padding:0 6px 8px}
.acc hr{border:none;border-top:1px solid var(--color-slate-200);margin:4px 8px}
.nav-c{position:relative;width:100%;display:flex;align-items:center;gap:10px;border:none;background:transparent;border-radius:10px;padding:7px 8px 11px;text-align:left;color:var(--color-slate-700);cursor:pointer;transition:background-color .15s}
.nav-c:hover{background:var(--color-slate-100)}
.nav-c.on{background:var(--color-primary-lightest)}
.nav-c.is-drop-target{box-shadow:inset 0 0 0 2px var(--color-primary)}
.nav-ic{width:28px;height:28px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--c);background:oklch(from var(--c) l c h / .13)}
.nav-c.on .nav-ic{background:var(--c);color:var(--color-white)}
.nav-c .nt{flex:1;min-width:0}
.nav-c .nt b{display:block;font-size:14px;font-weight:600;color:var(--text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-c .nt small,.nav-c .ns{font-size:12px;color:var(--text-color-secondary)}
.nav-c .ns{white-space:nowrap;text-align:right}
.nav-c .ns b{display:block;font-size:13px;color:var(--color-slate-700);font-weight:600}
.nav-c .nb{position:absolute;left:46px;right:8px;bottom:4px;height:3px;border-radius:999px;background:oklch(from var(--color-primary) l c h / .08);overflow:hidden}
.nav-c .nb i{display:block;height:100%;border-radius:999px;background:var(--c)}
/* Bloco de upgrade "tanque": nível do líquido = % usado; roxo → amarelo → vermelho */
.cta{position:relative;overflow:hidden;isolation:isolate;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--color-slate-50);color:var(--color-slate-900);border:1px solid var(--color-slate-200);--lvl:.1;--liq:var(--color-primary);--glow:oklch(from var(--color-primary-lighten) l c h / .7);--glow-dur:14s;--wave-dur:8s;transition:border-color .6s}
.cta::after{content:"";position:absolute;z-index:-1;pointer-events:none;width:140px;height:140px;right:-40px;top:-40px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);animation:brilho-flutua var(--glow-dur) ease-in-out infinite alternate}
@keyframes brilho-flutua{0%{transform:translate(0,0) scale(1);opacity:.85}35%{transform:translate(-38px,18px) scale(1.12);opacity:1}70%{transform:translate(-14px,42px) scale(.95);opacity:.75}100%{transform:translate(-56px,8px) scale(1.06);opacity:.95}}
@keyframes brilho-pulsa{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.35);opacity:1}}
.cta .tank{position:absolute;left:0;right:0;bottom:0;z-index:-1;pointer-events:none;height:calc(10% + var(--lvl) * 78%);transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
.cta .tank::before{content:"";position:absolute;inset:14px 0 0;background:linear-gradient(180deg,oklch(from var(--liq) l c h / .16),oklch(from var(--liq) l c h / .3));transition:background .8s}
.cta .wave{position:absolute;left:0;top:0;width:200%;height:16px;animation:onda var(--wave-dur) linear infinite}
.cta .wave.w2{opacity:.55;animation-duration:calc(var(--wave-dur) * 1.6);animation-direction:reverse;top:2px}
.cta .wave path{fill:oklch(from var(--liq) l c h / .18);transition:fill .8s}
@keyframes onda{to{transform:translateX(-50%)}}
.cta .ct{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.cta .ci{width:34px;height:34px;border-radius:10px;background:var(--color-primary-lightest);color:var(--color-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cta b{font-size:14px;color:var(--color-slate-900)}
.cta .ct small{display:block;font-size:12px;font-weight:500;color:var(--color-slate-500);margin-top:1px}
.cta .up{position:relative;z-index:1;border:none;border-radius:999px;padding:10px 0;font-weight:700;font-size:14px;cursor:pointer;background:var(--color-primary);color:var(--color-white);box-shadow:0 4px 14px oklch(from var(--color-primary) l c h / .35);transition:transform .15s,box-shadow .15s,background-color .15s}
.cta .up:hover{background:var(--color-primary-dark);transform:translateY(-1px);box-shadow:0 8px 20px oklch(from var(--color-primary) l c h / .45)}
.cta.lv-warn{--liq:var(--color-warning);--glow:oklch(from var(--color-warning) l c h / .3);--glow-dur:9s;--wave-dur:5s;border-color:oklch(from var(--color-warning) l c h / .35)}
.cta.lv-warn .ct small{color:var(--color-warning-dark)}
.cta.lv-crit{--liq:var(--color-negative);--glow:oklch(from var(--color-negative) l c h / .28);--wave-dur:3.2s;border-color:oklch(from var(--color-negative) l c h / .45)}
.cta.lv-crit .ct small{color:var(--color-negative)}
.cta.lv-crit .ci{background:var(--color-negative-lightest);color:var(--color-negative)}
.cta.lv-crit::after{width:170px;height:170px;animation:brilho-pulsa 3s ease-in-out infinite}
.cta.lv-crit .up{animation:botao-pulsa 2.4s ease-in-out infinite}
@keyframes botao-pulsa{0%,100%{box-shadow:0 4px 14px oklch(from var(--color-primary) l c h / .35)}50%{box-shadow:0 4px 24px oklch(from var(--color-primary) l c h / .65)}}
@media (prefers-reduced-motion:reduce){.cta::after,.cta .wave,.cta.lv-crit .up{animation:none}.cta .tank{transition:none}}
/* Uploads e lote (posicionamento) */
.uploads-dock{position:fixed;right:364px;bottom:24px;width:360px;z-index:850}
.uploads-dock .card-body{max-height:260px;overflow:auto;padding:0 16px}
.batch-dock{position:fixed;left:calc((100vw - 340px)/2);bottom:24px;transform:translateX(-50%);z-index:800}
/* Arrastar arquivos do computador */
.dropzone-overlay{position:fixed;inset:0;z-index:1050;pointer-events:none;display:none;align-items:center;justify-content:center;background:var(--dropzone-bg)}
.dropzone-overlay.is-active{display:flex;animation:fade-in-up .2s ease}
.dropzone-frame{position:absolute;inset:14px;border:2px dashed var(--dropzone-border-color);border-radius:var(--card-border-radius)}
.dropzone-card{align-items:center;text-align:center;padding:24px 32px;gap:8px}
/* Desktop: página sem rolagem; só a área de arquivos rola */
#device:not(.t) .app-shell{height:100vh;overflow:hidden}
#device:not(.t) .doc-app{height:calc(100vh - var(--app-header-height));overflow:hidden}
#device:not(.t) .doc-main{height:100%;overflow:hidden}
#device:not(.t) .doc-view-card{display:flex;flex-direction:column}
#device:not(.t) .doc-view{flex:1 1 auto;scrollbar-width:thin;scrollbar-color:var(--color-slate-300) transparent;}
#device:not(.t) .doc-view::-webkit-scrollbar{width:8px}
#device:not(.t) .doc-view::-webkit-scrollbar-thumb{background:var(--color-slate-300);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
#device:not(.t) .doc-head,#device:not(.t) #banner{flex-shrink:0}
#device:not(.t) .doc-view{overflow:auto}
#device:not(.t) .doc-side{overflow:hidden}
.side-scroll{display:flex;flex-direction:column;gap:inherit;min-height:0}
/* Desktop: a sidebar tem UM scroll só (topo). O card de upgrade fica fixo no rodapé visível. */
#device:not(.t) .side-scroll{flex:1 1 auto;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--color-slate-300) transparent;margin:0 -6px;padding:0 6px}
#device:not(.t) .side-scroll>*{flex-shrink:0}
#device:not(.t) .acc,#device:not(.t) .acc.open{flex:0 0 auto;min-height:0}
#device:not(.t) .acc.open .acc-b>div{overflow:visible}
#device:not(.t) .doc-side{gap:10px;padding:14px}
#device:not(.t) .stc{padding:12px 14px}
#device:not(.t) .cta{padding:12px 14px;gap:10px}
#device:not(.t) .cta{flex-shrink:0;margin-top:auto}
#device:not(.t) .stc{flex-shrink:0}

/* =====================================================================
   RESPONSIVIDADE — .t = até 1024px (tablet e celular) · .m = até 768px (celular)
   ===================================================================== */
#device{min-height:100vh}
.mobile-only,#q-cancel,#btn-menu,#side-back{display:none}
#device.t .doc-main{padding:16px 20px 96px}
#device.t .doc-side{position:fixed;top:0;right:0;bottom:0;height:auto;width:min(340px,88%);z-index:950;transform:translateX(105%);transition:transform .25s ease;background:var(--drawer-bg)}
#device.t.side-open .doc-side{transform:none}
#device.t.side-open #side-back{display:block;position:fixed;inset:0;z-index:940}
#device.t #btn-menu{display:inline-flex}
#device.t .doc-search{max-width:none}
#device.t .batch-dock{left:50%}
#device.t .uploads-dock{right:20px}
#device.t .grid-item-quicklook{display:none}
#device.t .doc-view-card{flex:none}
/* Celular */
#device.m .doc-main{padding:0 12px 24px;gap:12px}
#device.m .doc-head{border:none;background:transparent}
#device.m .doc-head .card-body{padding:0}
#device.m .doc-topbar{display:none;position:sticky;top:0;z-index:60;background:var(--body-bg);padding:10px 0}
#device.m.msearch .doc-topbar{display:flex}
#device.m.msearch .app-bar{display:none}
#device.m #q-cancel{display:inline-flex}
#device.m #btn-logs,#device.m #btn-menu,#device.m .breadcrumb,#device.m .desktop-only{display:none}
#device.m .mobile-only{display:flex}
#device.m .doc-filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
#device.m .doc-filters>*{flex-shrink:0}
#device.m .doc-view-card{border:none;background:transparent}
#device.m .file-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0}
#device.m .grid-item-thumb{height:112px;flex-basis:112px;padding-top:10px}
#device.m .app-header{display:none}
#device.t .doc-side{margin:0;border-radius:0;border-width:0 0 0 1px}
#device.t .app-header{padding:0 20px}
#device.t .app-header .ah-search{flex-basis:360px}
#device.m .grid-item-check{display:none}
#device.m.selmode .grid-item-check{display:inline-flex;opacity:1;top:46px;left:8px}
#device.m .grid-item-foot .badge-list{display:none}
#device.m .compact-list{gap:8px}
#device.m .search-row{grid-template-columns:28px 1fr;padding:12px}
#device.m .search-row>.search-row-time{display:none}
#device.m .timeline{padding:12px}
#device.m .batch-dock{left:0;right:0;bottom:0;transform:none}
#device.m .batch-bar{border-radius:18px 18px 0 0;padding:8px 8px calc(10px + env(safe-area-inset-bottom));overflow-x:auto;justify-content:space-around}
#device.m .batch-bar button{flex-direction:column;gap:3px;min-height:44px}
#device.m .batch-bar .batch-count{display:none}
#device.m .uploads-dock{left:8px;right:8px;width:auto;bottom:16px}
#device.m .snackbar-container{left:12px;right:12px;align-items:stretch}
#device.m .classify-row{flex-wrap:wrap}
#device.m .classify-row .picker-trigger{flex:1;max-width:none}
#device.m .manage-sub{grid-template-columns:1fr 40px 32px}
#device.m .manage-sub [data-kw]{grid-column:1/-1;grid-row:2}
#device.m .manage-sub-head{display:none}
.app-bar{position:sticky;top:0;z-index:60;background:var(--body-bg);display:flex;align-items:center;gap:4px;padding:10px 0}
.app-bar .btn-icon{width:44px;height:44px}
.app-bar-title{flex:1;min-width:0;padding:0 4px}
.area-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.area-chips .btn{flex-shrink:0;min-height:36px}
/* Documento aberto (tablet/celular): drawer lateral em tela cheia */
.doc-viewer{inset:0;width:100%}
.doc-viewer-head{display:flex;align-items:center;gap:4px;padding:8px 6px;flex-shrink:0}
.doc-viewer-head .btn-icon{width:44px;height:44px}
.doc-viewer-scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.doc-viewer-doc{padding:16px 12px 10px}
.doc-viewer-doc .pg{max-width:680px}
.doc-viewer-info{padding:14px 14px 24px;display:flex;flex-direction:column;gap:12px;max-width:720px;margin:0 auto;width:100%}
.doc-viewer-info details>summary{list-style:none;cursor:pointer}
.doc-viewer-info details>summary::-webkit-details-marker{display:none}
.doc-viewer-info details[open] .chevron{transform:rotate(180deg)}
.doc-viewer-actions{flex-shrink:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.doc-viewer-actions .btn{flex-direction:column;gap:2px;min-height:52px;padding:6px 4px;font-size:12px}

/* =====================================================================
   SIMULAÇÃO — miniatura da 1ª página e páginas do documento (produção: imagem gerada no back-end e
   visualizador pdf.js) + controle "Ver como". NÃO IMPLEMENTAR.
   ===================================================================== */
.paper{background:var(--color-white);border-radius:3px;border:1px solid var(--color-slate-200);padding:14% 12% 10%;display:flex;flex-direction:column;gap:5%;overflow:hidden;position:relative;aspect-ratio:210/297}
.paper .hd{height:4px;background:var(--color-slate-300);border-radius:2px;width:70%;align-self:center}
.paper .tt{font:700 7px/1.25 var(--font-head);text-align:center;text-transform:uppercase}
.paper .ln{height:3px;border-radius:2px;background:var(--color-slate-200)}
.paper .ln-indent{margin-left:12%}
.paper .sig{margin-top:auto;align-self:flex-end;width:38%;border-top:1px solid var(--color-slate-300);padding-top:2px;font:6px var(--font-body);color:var(--color-slate-400);text-align:center}
.paper .tg{position:absolute;right:6px;top:6px;font:700 7px var(--font-body);color:var(--color-white);background:var(--color-slate-500);padding:2px 4px;border-radius:3px}
.paper .sheet{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:1px;background:var(--color-slate-200)}
.paper .sheet i{background:var(--color-white);height:7px;display:block}
.paper.img{padding:0;background:var(--color-slate-100)}
.pages{display:flex;flex-direction:column;align-items:center;gap:18px}
.pg{width:100%;max-width:560px;background:var(--color-white);border:1px solid var(--color-slate-200);border-radius:3px;aspect-ratio:210/297;padding:9% 10%;font-size:12px;line-height:1.65;overflow:hidden;position:relative}
.pg .pg-h{font-size:12px;text-transform:uppercase;margin-bottom:18px;font-weight:600}
.pg .pg-t{text-align:center;font-weight:700;font-size:13px;text-transform:uppercase;margin:6px 0 16px;font-family:var(--font-head)}
.pg p{margin:0 0 10px;text-align:justify;text-indent:2.2em}
.pg .pg-s{position:absolute;bottom:9%;right:10%;width:38%;border-top:1px solid var(--color-slate-400);text-align:center;font-size:12px;color:var(--color-slate-500);padding-top:4px}
.pg .pg-n{position:absolute;bottom:4%;left:0;right:0;text-align:center;font-size:12px;color:var(--color-slate-400)}
.pg.sheetpg{padding:6%}
.pg.sheetpg table{width:100%;border-collapse:collapse}
.pg.sheetpg th,.pg.sheetpg td{border:1px solid var(--color-slate-200);padding:5px 7px;text-align:left}
.pg.sheetpg .n{text-align:right}
.pg.imgpg{padding:0;background:var(--color-slate-100)}
.pg.imgpg .ocrcap{position:absolute;left:0;right:0;bottom:0;height:40%;padding:14px 18px;background:var(--color-white);border-top:1px solid var(--color-slate-200);overflow:auto}
.pv{position:fixed;left:16px;bottom:16px;z-index:2000;display:flex;align-items:center;gap:4px;background:var(--color-slate-900);color:var(--color-white);border-radius:999px;padding:4px 4px 4px 12px;font-size:12px}
.pv button{border:none;background:transparent;color:var(--color-slate-300);font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;cursor:pointer}
.pv button.on{background:var(--color-white);color:var(--color-slate-900)}
.pv input{width:110px}
body.framed{background:var(--color-slate-700)}
body.framed #device{margin:16px auto;height:calc(100vh - 32px);min-height:0;overflow:auto;border:10px solid var(--color-slate-900);border-radius:40px;transform:translateZ(0);background:var(--body-bg)}
body.framed #device.m{width:390px}
body.framed #device.t:not(.m){width:820px}
</style>

<body>
<div id="device">
<div class="app-shell">
<header class="app-header" aria-label="Header global (produção)"><span class="ah-title">☰ Documentos <span class="text-secondary">ⓘ</span></span><div class="ah-search">🔍 Buscar processos, clientes, tarefas... <kbd>Ctrl + K</kbd></div><div class="ah-user"><span class="ah-av">JS</span><span><b>JEZIEL SILVA</b>OAB 999999 AP</span></div></header>
<div class="doc-app">
  <!-- ================= CONTEÚDO ================= -->
  <main class="doc-main" id="main">
    <section class="card doc-head" aria-label="Busca, cabeçalho e filtros">
      <div class="card-body">
        <div class="doc-topbar">
          <div class="input-group doc-search" role="search">
            <span class="input-group-text" id="ico-search"></span>
            <input id="q" class="form-control" type="search" autocomplete="off" placeholder="Buscar por nome, nº do processo, cliente ou conteúdo do PDF (OCR)..." aria-label="Buscar documentos">
            <button type="button" class="btn-close" id="q-clear" aria-label="Limpar busca" hidden></button>
          </div>
          <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" id="q-cancel">Cancelar</button>
          <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" id="btn-logs"></button>
          <button type="button" class="btn btn-icon" id="btn-menu" aria-label="Abrir navegação"></button>
        </div>
        <div id="xhead"></div>
        <nav id="crumbs" aria-label="Caminho"></nav>
        <div class="doc-filters" id="filters"></div>
      </div>
    </section>
    <div class="doc-alerts" id="banner"></div>
    <section class="card doc-view-card" aria-label="Arquivos">
      <div id="tabs"></div>
      <div class="card-body doc-view" id="view" aria-live="polite"></div>
    </section>
  </main>

  <!-- ================= SIDEBAR (direita) ================= -->
  <aside class="doc-side" aria-label="Navegação de documentos">
    <div class="side-scroll">
    <button type="button" class="new-btn" data-act="create-menu" aria-haspopup="menu"><span class="pc" id="new-ic"></span>Novo arquivo</button>
    <div class="quick" id="fav-slot"></div>
    <div class="stc" id="stc">
      <div class="st-top"><div class="st-used tabular-nums" id="st-used"></div><span class="st-pct tabular-nums" id="st-pct"></span></div>
      <div class="st-seg" role="tablist" aria-label="Agrupar uso">
        <button type="button" class="on" data-st="area" role="tab" aria-selected="true">Por categoria</button>

function height(f){const subs=f.children.filter(c=>c.type==='folder');return 1+(subs.length?Math.max(...subs.map(height)):0);}

function walk(n,fn){fn(n);if(n.type==='folder'&&!n.virtual)n.children.forEach(c=>walk(c,fn));}
function allFiles(k){const out=[];(k?[ROOT[k]]:Object.values(ROOT)).forEach(r=>walk(r,n=>{if(n.type==='file')out.push(n);}));return out;}
function allNodes(k){const out=[];(k?[ROOT[k]]:Object.values(ROOT)).forEach(r=>walk(r,n=>{if(!n.isRoot)out.push(n);}));return out;}
function calcList(k){

function uniqueName(parent,name){if(!siblingsHave(parent,name))return name;const dot=name.lastIndexOf('.');const base=dot>0?name.slice(0,dot):name,ext=dot>0?name.slice(dot):'';let i=2;while(siblingsHave(parent,`${base} (${i})${ext}`))i++;return `${base} (${i})${ext}`;}
function checkMove(item,dest){
  if(!dest||dest.virtual)return 'Destino inválido';
  if(item===dest||(item.type==='folder'&&isAncestor(item,dest)))return 'Uma pasta não pode ser movida para dentro dela mesma';
  if(item.parent===dest)return 'O item já está nesta pasta';
  if(item.type==='folder'&&depth(dest)+height(item)>MAX_DEPTH)return 'Limite de 3 níveis de pastas atingido';
  if(siblingsHave(dest,item.name,item))return 'Já existe um item com este nome no destino';

}

function sugerirTipos(f){
  if(!f||f.type!=='file')return [];

    let wn=0,wt=0;s.kw.forEach(w=>{const idf=IDF[w]||1;if(has(nome,w)){wn+=idf;if(why.length<2&&!why.some(x=>x.includes(w)))why.push(`nome contém “${w}”`);}else if(has(texto,w)){wt+=idf;if(why.length<2&&!why.some(x=>x.includes(w)))why.push(`texto contém “${w}”`);}});

function loadMoreHTML(folder,total,shown,ctx){
  if(total<=PAGE)return '';
  const pct=Math.round(shown/total*100),rest=Math.min(PAGE,total-shown),busy=MORE_LOADING===folder.id;
  const sk=busy?(ctx==='grid'?'<div class="skeleton skeleton-card"></div>'.repeat(4):'<div class="skeleton skeleton-row"></div>'.repeat(3)):'';
  const bar=`<div class="progressbar load-more-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${shown}" aria-label="Itens carregados"><div class="progressbar__fill" data-pct="${pct}"></div></div>`;
  if(shown>=total)return `<div class="load-more"><span class="small text-secondary tabular-nums">${total} de ${total} itens · fim da pasta</span></div>`;
  return sk+`<div class="load-more ${busy?'is-busy':''}"><span class="small text-secondary tabular-nums">Mostrando <b>${shown}</b> de <b>${total}</b> itens</span>${bar}
    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill load-more-btn ${busy?'btn-loading':''}" data-act="load-more" data-folder="${folder.id}" ${busy?'disabled':''}>${busy?'<span class="spinner-border"></span>Carregando…':`${ic('chevDown',15)}Carregar mais ${rest}`}</button></div>`;
}

/* =====================================================================
   5. PEÇAS DE INTERFACE — equivalentes aos componentes do UI-Kit
   (produção: <e-icon>, <e-badge>, <e-alert>, .card, .btn…)
   ===================================================================== */
const SEV_BADGE={critico:'negative',atencao:'warning',normal:'secondary'};
const STATUS_BADGE={rascunho:'warning',protocolado:'positive',arquivado:'secondary'};
const badge=(type,text,icon='')=>`<span class="badge badge-${type}">${icon?ic(icon,12,2.4):''}${text}</span>`;
/* Cor persistida/editada pelo usuário: única exceção de binding inline permitida pelo UI-Kit (.badge-custom-color) */
function contrastText(hex){const h=(hex||'').replace('#','');if(h.length!==6)return tok('--color-white');const [r,g,b]=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255);return (0.299*r+0.587*g+0.114*b)>0.62?tok('--color-slate-900'):tok('--color-white');}
const catBadge=(cor,text,icon='')=>`<span class="badge badge-custom-color${icon?' badge-custom-color-with-icon':''}" style="--badge-custom-bg-color:${esc(cor)};--badge-custom-text-color:${contrastText(cor)}">${icon?`<span class="badge-icon">${ic(icon,12,2.4)}</span>`:''}<span class="badge-label">${text}</span></span>`;
const eAlert=(type,{titulo='',html='',acoes='',role='status',icone=''})=>`<div class="alert alert-${type} fade-in" role="${role}"><span class="alert-icon">${ic(icone||({info:'alert',negative:'alert',positive:'check',light:'alert'}[type]),16)}</span><div class="flex-fill">${titulo?`<span class="alert-title">${titulo}</span>`:''}${html}</div>${acoes}</div>`;
function typeIcon(it,s=18){
  if(it.type==='folder')return `<span class="card-list-action__icon text-primary">${ic('folder',s)}</span>`;
  return `<span class="card-list-action__icon text-secondary">${ic(KICON[kind(it.ext)],s)}</span>`;
}
function badges(f){
  if(f.type!=='file')return '';
  let b='';
  const t=tipoById(f.tipo);
  b+=t?catBadge(t.cor,esc(curto(t.nome)),t.ic):badge('warning','Sem classificação','alert');
  if(f.proc)b+=`<span class="badge badge-outline-secondary tabular-nums">Proc. ${esc(f.proc)}</span>`;
  if(f.status)b+=badge(STATUS_BADGE[f.status],STATUS[f.status]);
  const dl=deadlineInfo(f.deadline);if(dl)b+=badge(SEV_BADGE[dl.sev],dl.rot,'clock');
  if(f.ocr==='proc')b+=`<span class="badge badge-info"><span class="spinner-border"></span>OCR em andamento</span>`;
  return `<div class="badge-list">${b}</div>`;
}
/* SIMULAÇÃO da miniatura (1ª página). Produção: imagem gerada no back-end (thumbUrl). */
function thumb(f){
  const k=kind(f.ext),title=esc(f.name.replace(/\.[^.]+$/,'').replace(/^Modelo — /,''));
  const tg=`<span class="tg">${esc(f.ext)}</span>`;
  if(f.thumbUrl)return `<div class="paper ${k} p-0"><img class="w-100" src="${esc(f.thumbUrl)}" alt="">${tg}</div>`;
  if(k==='img')return `<div class="paper img d-flex align-items-center justify-content-center text-secondary">${tg}${ic('image',28)}</div>`;
  if(k==='xlsx'){let c='';for(let r=0;r<33;r++)c+='<i></i>';return `<div class="paper xlsx">${tg}<div class="tt text-start">${title}</div><div class="sheet">${c}</div></div>`;}
  return `<div class="paper ${k}">${tg}<div class="hd"></div><div class="tt">${title}</div>${[0,1,2,3,4,5,6,7,8].map(i=>`<div class="ln${i===0||i===4?' ln-indent':''}"></div>`).join('')}<div class="sig">assinatura</div></div>`;
}
/* SIMULAÇÃO das páginas (painel e visualização rápida). Produção: visualizador pdf.js / imagem real. */
function pagesHTML(f){
  const k=kind(f.ext);
  if(k==='img')return `<div class="pages"><div class="pg imgpg"><div class="d-flex align-items-center justify-content-center text-secondary w-100" aria-hidden="true">${ic('image',48)}</div>
      <div class="ocrcap"><span class="d-flex align-items-center gap-1 fw-bold text-primary mb-2">${ic('spark',12)}Texto reconhecido (OCR)</span>${f.ocr==='proc'?'<span class="text-secondary">Processando…</span>':esc(f.text||'Nenhum texto reconhecido.')}</div></div></div>`;
  if(k==='xlsx'){
    const rows=[['Honorários contratuais','05/10','3.500,00'],['Custas iniciais','08/10','1.214,32'],['Perícia contábil','12/10','4.800,00'],['Diligência correspondente','15/10','350,00'],['Cópias e autenticações','18/10','86,40'],['Deslocamento','20/10','142,00'],['Honorários êxito','28/10','12.400,00']];
    return `<div class="pages"><div class="pg sheetpg"><table><thead><tr><th>Descrição</th><th>Vencimento</th><th>Valor (R$)</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td class="n">${r[2]}</td></tr>`).join('')}<tr><th>Total</th><th></th><th class="n">22.492,72</th></tr></tbody></table><div class="pg-n">${esc(f.name)}</div></div></div>`;
  }
  const paras=(f.text||'Documento sem texto extraído. A pré-visualização completa será exibida pelo visualizador de PDF após o processamento.').split('\n');
  const head=paras[0]&&paras[0]===paras[0].toUpperCase()&&paras[0].length>30?paras.shift():'';
  const title=f.name.replace(/\.[^.]+$/,'').replace(/^Modelo — /,'');
  return `<div class="pages"><div class="pg">${head?`<div class="pg-h">${esc(head)}</div>`:''}<div class="pg-t">${esc(title)}</div>${paras.map(p=>`<p>${esc(p)}</p>`).join('')}<div class="pg-s">${esc(USERS[f.author].nome)}<br>OAB/RJ 000.000</div><div class="pg-n">Página 1 de ${Math.max(1,Math.ceil(f.size/400000))}</div></div></div>`;
}
const metaRows=f=>`<tr><td>Tipo</td><td>${esc(f.ext)}</td></tr><tr><td>Tamanho</td><td>${fmtSize(f.size)}</td></tr><tr><td>Modificado</td><td>${fmtDate(f.mtime)}</td></tr>
  <tr><td>Autor</td><td>${esc(USERS[f.author].nome)}</td></tr><tr><td>Local</td><td><button type="button" class="btn btn-link btn-sm p-0" data-goto="${f.id}">${esc(locationOf(f))}</button></td></tr>`;
const metaHTML=f=>`<table class="table"><tbody>${metaRows(f)}</tbody></table>`;
const emptyText=()=>S.area==='lix'?'A lixeira está vazia':S.area==='fav'?'Nenhum favorito ainda':S.area==='prz'?'Nenhum arquivo vinculado a prazos':'Nenhum arquivo vinculado a tarefas';

function render(){renderNav();renderBanner();renderHead();renderTabs();renderCrumbs();renderFilters();renderView();renderBatch();renderStorage();if(PNL.item)renderPanel();}

function renderNav(){
  if(S.selMode&&!S.sel.size&&!isM())S.selMode=false;
  document.getElementById('device').classList.toggle('selmode',!!S.selMode&&isM());
  const cnt=k=>k==='tar'||k==='prz'||k==='fav'?calcList(k).length:k==='lix'?TRASH.length:allFiles(k).length;
  const bytes=k=>k==='lix'?TRASH.reduce((s,t)=>{let x=0;walk(t.item,n=>{if(n.type==='file')x+=n.size;});return s+x;},0):allFiles(k).reduce((s,f)=>s+f.size,0);
  const content=AREAS.filter(a=>!a.calc),total=content.reduce((s,a)=>s+bytes(a.k),0)+bytes('lix')||1;
  const fv=cnt('fav'),lx=cnt('lix'),pend=semTipo().length;
  /* Favoritos (borda de destaque) e Lixeira lado a lado */
  $('#fav-slot').innerHTML=`<button type="button" class="fav-hi ${S.area==='fav'?'on':''}" data-area="fav" aria-current="${S.area==='fav'?'page':'false'}"><span class="fi">${ic('star',16)}</span><span><b>Favoritos</b><small>${fv} ${fv===1?'item':'itens'}</small></span></button>
    <button type="button" class="lix-q ${S.area==='lix'?'on':''}" data-area="lix" aria-current="${S.area==='lix'?'page':'false'}"><span class="li">${ic('trash',15)}</span><span><b>Lixeira</b><small>${lx} ${lx===1?'item':'itens'} · ${fmtSize(bytes('lix'))}</small></span></button>`;
  /* "Todos os documentos": acordeão (começa fechado) com categorias + Tarefas e Prazos */
  const all=content.reduce((s,a)=>s+cnt(a.k),0),allB=content.reduce((s,a)=>s+bytes(a.k),0);
  const row=(a,c,b)=>{const p=b/total*100;return `<button type="button" class="nav-c pal-${a.pal} ${S.area===a.k?'on':''}" data-area="${a.k}" ${ROOT[a.k]?`data-drop="${ROOT[a.k].id}"`:''} aria-current="${S.area===a.k?'page':'false'}"><span class="nav-ic">${ic(a.ic,15)}</span><span class="nt"><b>${esc(a.nome)}</b><small>${c} arquivo${c!==1?'s':''}</small></span><span class="ns tabular-nums"><b>${fmtSize(b)}</b>${Math.round(p)}%</span><span class="nb"><i data-pct="${Math.max(2,p)}"></i></span></button>`;};
  const rows=content.map(a=>row(a,cnt(a.k),bytes(a.k))).join('');
  const calc=['tar','prz'].map(k=>{const fs=calcList(k);return row(areaOf(k),fs.length,fs.reduce((x,f)=>x+f.size,0));}).join('');
  $('#cls-slot').innerHTML=`<button type="button" class="cls-entry" data-act="manage-cls"><span class="tpi">${ic('tag',15)}</span><span><b>Classificações</b><small>${CATS.length} áreas · ${SUBS.length} peças</small></span>${pend?`<span class="hot" aria-label="${pend} arquivos sem classificação">${pend}</span>`:''}<span class="go">${ic('chev',15)}</span></button>`;
  const open=S.accOpen??(store.get('accOpen','0')==='1');
  $('#acc').className='acc'+(open?' open':'');
  $('#acc').innerHTML=`<button type="button" class="acc-h" data-acc aria-expanded="${open}" aria-controls="acc-b"><span class="ai">${ic('folder',16)}</span><span><b>Todos os documentos</b><small>${all} arquivos · ${fmtSize(allB)}</small></span><span class="chv">${ic('chevDown',18)}</span></button>
    <div class="acc-b" id="acc-b"><div><nav class="d-flex flex-column gap-1" aria-label="Categorias">${rows}<hr>${calc}</nav></div></div>`;
  $$('#acc .nb i').forEach(x=>x.style.width=x.dataset.pct+'%');
}
function untypedNote(){
  if(S.tnoteHidden||S.q)return '';
  const st=semTipo();if(!st.length)return '';
  const conf=st.filter(f=>{const s=sugerirTipos(f)[0];return s&&s.conf>=80;}).length;
  return eAlert('info',{icone:'tag',titulo:`${st.length} arquivo${st.length>1?'s':''} sem classificação ${badge('warning','Pendente')}`,
    html:`<span class="d-block">Classifique por área e peça para filtrar e encontrar mais rápido${conf?` · <b>${conf} com sugestão confiável</b>`:''}.</span>`,
    acoes:`<div class="d-flex align-items-center gap-2 flex-shrink-0"><button type="button" class="btn btn-sm btn-primary rounded-pill" data-act="classify">${ic('spark',14)}Classificar agora</button><button type="button" class="btn-close" data-act="tnote-hide" aria-label="Lembrar depois">${ic('x',16)}</button></div>`});
}
function renderBanner(){
  const el=$('#banner');const note=untypedNote();
  if(S.area!=='proc'){el.innerHTML=note;return;}
  const list=allFiles('proc').filter(f=>f.deadline!=null&&f.deadline<=7).sort((a,b)=>a.deadline-b.deadline);
  if(!list.length){el.innerHTML=note;return;}
  el.innerHTML=note+eAlert('negative',{role:'alert',icone:'clock',titulo:`${list.length} arquivo${list.length>1?'s':''} vinculado${list.length>1?'s':''} a prazos vencendo esta semana`,
    html:`<span class="d-block">Confira antes de arquivar ou mover para outra pasta.</span><div class="alert-chips">${list.map(f=>{const d=deadlineInfo(f.deadline);return `<button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" data-open="${f.id}">${esc(f.name.replace(/\.[^.]+$/,''))}${badge(SEV_BADGE[d.sev],d.rot)}</button>`;}).join('')}</div>`});
}
function levelBadge(f,a){
  if(S.q)return '';
  if(a.calc)return badge('secondary','Visão automática');
  const d=depth(f);return badge(d===MAX_DEPTH?'warning':'secondary',d===0?'Raiz':`Nível ${d} de ${MAX_DEPTH}`);
}
function renderHead(){
  if(isM())return renderMobileHead();
  const a=areaOf(S.area),f=cur();
  const title=S.q?'Resultados da busca':(f.isRoot?a.nome:f.name);
  let acts='';
  if(S.area==='lix')acts=`<button type="button" class="btn btn-sm btn-danger rounded-pill" data-act="empty-trash" ${TRASH.length?'':'disabled'}>${ic('trash',14)}Esvaziar lixeira</button>`;
  else if(isT())acts=`<button type="button" class="btn btn-sm btn-success rounded-pill dropdown-toggle" data-act="create-menu" aria-haspopup="menu" ${S.q?'disabled':''}>${ic('plus',14,2.4)}Novo</button>`;
  $('#xhead').innerHTML=`<div class="file-list-toolbar"><span class="doc-title text-primary text-truncate">${esc(title)}</span>${levelBadge(f,a)}<div class="file-list-actions">${acts}
    <div class="file-list-view-toggle" role="group" aria-label="Modo de visualização"><button type="button" class="file-list-view-toggle__button file-list-view-toggle__button--start ${S.view==='list'?'active':''}" data-act="view-list" aria-pressed="${S.view==='list'}">${ic('list',14)}Lista</button><button type="button" class="file-list-view-toggle__button file-list-view-toggle__button--end ${S.view==='grid'?'active':''}" data-act="view-grid" aria-pressed="${S.view==='grid'}">${ic('grid',14)}Grid</button></div></div></div>`;
}
function renderTabs(){
  const el=$('#tabs');
  if(!inProcess()){el.innerHTML='';if(S.tab!=='arquivos')S.tab='arquivos';return;}
  const p=S.path[1],tab=(k,icn,l)=>`<li class="nav-item" role="presentation"><button type="button" class="nav-link ${S.tab===k?'active':''}" role="tab" aria-selected="${S.tab===k}" data-tab="${k}">${ic(icn,14)}${l}</button></li>`;
  el.innerHTML=`<div class="card-header"><ul class="nav nav-tabs card-header-tabs" role="tablist">${tab('arquivos','folder','Arquivos')}${tab('timeline','history','Linha do tempo')}</ul><span class="badge badge-outline-secondary tabular-nums ms-auto">Proc. ${esc(p.proc||'')}</span></div>`;
}
function renderCrumbs(){
  const el=$('#crumbs');
  if(S.q){el.innerHTML='';return;}
  el.innerHTML=`<ol class="breadcrumb">${S.path.map((p,i)=>{const last=i===S.path.length-1;return `<li class="breadcrumb-item ${last?'active':''}" ${p.virtual?'':`data-drop="${p.id}"`} ${last?'aria-current="page"':''}>${i?ic('chev',13):''}${last?esc(p.name):`<button type="button" class="btn btn-link btn-sm" data-crumb="${i}">${esc(p.name)}</button>`}</li>`;}).join('')}</ol>`;
}
function filterSummary(k){
  const F=S.f;
  if(k==='proc')return F.proc?'Proc. '+F.proc.slice(0,7)+'…':'Nº do processo';
  if(k==='autor')return F.autor?USERS[F.autor].nome:'Autor';
  if(k==='prazo')return F.prazo?{vencidos:'Vencidos',hoje:'Vence hoje',semana:'Próximos 7 dias'}[F.prazo]:'Prazo';
  if(k==='dtipo')return F.dtipo?(F.dtipo==='none'?'Sem classificação':(CATS.find(c=>c.id===F.dtipo)||{nome:'Classificação'}).nome):'Classificação';
  if(k==='tipo')return F.tipo?{pdf:'PDF',docx:'Documento',xlsx:'Planilha',img:'Imagem'}[F.tipo]:'Tipo';
  if(k==='ano')return F.ano?String(F.ano):'Ano';
}
function renderFilters(){
  const keys=['dtipo','proc','autor','prazo','tipo','ano'];
  $('#filters').innerHTML=`<span class="small text-secondary d-flex align-items-center gap-1 desktop-only">${ic('filter',13)}Filtrar</span>`+keys.map(k=>`<button type="button" class="btn btn-sm btn-outline-secondary rounded-pill dropdown-toggle ${S.f[k]?'active':''}" data-filter="${k}" aria-haspopup="true" aria-pressed="${!!S.f[k]}">${esc(filterSummary(k))}</button>`).join('')
    +(anyFilter()?`<button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" data-act="clear-filters">${ic('x',13)}Limpar filtros</button>`:'');
}
function renderView(){
  const v=$('#view');
  if(S.q)return renderSearch(v);
  if(S.tab==='timeline'&&inProcess())return renderTimeline(v);
  if(S.view==='list'){if(isT())renderCompact(v);else renderFinder(v);}else renderGrid(v);
  if(S.renaming){const inp=$('#rn-input');if(inp){inp.focus();inp.setSelectionRange(0,inp.value.length);}}
}

/* ---------- Lista (colunas) ---------- */
function renameField(it){
  const isFile=it.type==='file',ext=isFile?it.name.slice(it.name.lastIndexOf('.')):'';
  const val=S.renameVal!==''?S.renameVal:(isFile?it.name.slice(0,-ext.length):it.name);
  return `<span class="rename-field"><input id="rn-input" data-id="${it.id}" class="form-control form-control-sm ${S.renameErr?'is-invalid':''}" value="${esc(val)}" aria-label="Novo nome">${S.renameErr?`<span class="invalid-feedback">${esc(S.renameErr)}</span>`:''}</span>`;
}
const kebab=it=>`<button type="button" class="btn btn-icon btn-sm" data-act="menu" aria-label="Ações de ${esc(it.name)}">${ic('more',16)}</button>`;
function rowHTML(it,i){
  const open=S.path[i+1]===it, deepest=open&&i===S.path.length-2;
  const sel=S.sel.has(it.id)||(deepest&&!S.sel.size);
  const dl=it.type==='file'?deadlineInfo(it.deadline):null;
  const mk=[it.fav?`<span class="text-secondary d-flex" aria-label="Favorito">${ic('star',12)}</span>`:'',it.type==='file'&&it.ocr==='proc'?'<span class="spinner-border text-secondary" aria-label="OCR em andamento"></span>':'',dl?`<span class="badge badge-${SEV_BADGE[dl.sev]}" title="${dl.rot}">${ic('clock',11,2.5)}</span>`:''].join('');
  const name=S.renaming===it.id?renameField(it):`<span class="finder-row-name text-truncate ${open?'fw-semibold':''}">${esc(it.name)}</span>`;
  return `<div class="finder-row file-list-item ${sel?'active':''}" tabindex="0" role="treeitem" aria-selected="${sel}" ${it.type==='folder'?`aria-expanded="${open}" data-drop="${it.id}"`:''} data-id="${it.id}" data-col="${i}" draggable="${S.renaming===it.id?'false':'true'}">${typeIcon(it)}${name}<span class="d-flex align-items-center gap-1">${mk}</span>${kebab(it)}${it.type==='folder'?`<span class="d-flex text-secondary">${ic('chev',14)}</span>`:''}</div>`;
}
function previewHTML(f){
  const inTrash=S.area==='lix';
  return `<div class="preview-stage file-list-item-thumb">${thumb(f)}</div><span class="card-title text-center">${esc(f.name)}</span>${badges(f)}${metaHTML(f)}
    ${inTrash?`<button type="button" class="btn btn-success rounded-pill w-100" data-act="restore-sel">${ic('restore',14)}Restaurar</button><button type="button" class="btn btn-danger rounded-pill w-100" data-act="purge-sel">${ic('trash',14)}Excluir definitivamente</button>`
    :`<button type="button" class="btn btn-primary rounded-pill w-100" data-open="${f.id}">${ic('open',14)}Abrir</button>`}`;
}
function renderFinder(v){
  COLS=[];
  let html='<div class="finder" id="finder" tabindex="0" role="tree" aria-label="Pastas e arquivos">';
  S.path.forEach((folder,i)=>{
    const all=visibleChildren(folder),items=shownOf(folder,all);COLS.push(items);
    const total=childrenOf(folder).length;
    if(!items.length&&all.length){}
    html+=`<div class="finder-col border-end" data-col="${i}" ${folder.virtual?'':`data-drop="${folder.id}"`}><div class="finder-col-head border-bottom small fw-semibold text-secondary"><span class="text-truncate">${esc(folder.isRoot?areaOf(S.area).nome:folder.name)}</span><span class="d-flex align-items-center gap-1"><span class="tabular-nums">${anyFilter()?items.length+'/':''}${total}</span>${folder.virtual||S.area==='lix'?'':(()=>{const r=createBlockReason(folder);return `<button type="button" class="btn btn-icon btn-sm" data-act="new-folder-in" data-folder="${folder.id}" aria-label="Nova pasta em ${esc(folder.isRoot?areaOf(S.area).nome:folder.name)}" ${r?`disabled title="${esc(r)}"`:''}>${ic('folderPlus',15)}</button>`;})()}</span></div><div class="finder-col-body">`;
    if(S.loadingId===folder.id)html+='<div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row w-70"></div>';
    else if(!items.length)html+=total&&anyFilter()?`<div class="finder-empty text-secondary">${ic('filter',28)}Nenhum item corresponde aos filtros<button type="button" class="btn btn-sm btn-outline-secondary rounded-pill" data-act="clear-filters">Limpar filtros</button></div>`
      :folder.virtual?`<div class="finder-empty text-secondary">${ic(areaOf(S.area).ic,28)}${emptyText()}</div>`
      :`<div class="finder-empty text-secondary">${ic('folder',28)}Pasta vazia<span class="small">Arraste arquivos para cá ou</span><button type="button" class="btn btn-sm btn-success rounded-pill" data-act="upload-to" data-folder="${folder.id}">${ic('upload',13)}Enviar arquivo</button></div>`;
    else html+=items.map(it=>rowHTML(it,i)).join('')+loadMoreHTML(folder,all.length,items.length,'list');
    html+='</div>';

/* ---------- Busca ---------- */
function snippet(text,q){
  const t=String(text||''),i=norm(t).indexOf(norm(q));if(i<0)return '';
  const s=Math.max(0,i-60),e=Math.min(t.length,i+q.length+80);
  return (s?'…':'')+esc(t.slice(s,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length,e))+(e<t.length?'…':'');
}
function hl(name,q){const i=norm(name).indexOf(norm(q));return i<0?esc(name):esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+q.length))+'</mark>'+esc(name.slice(i+q.length));}
function searchResults(){
  const q=S.q.trim();if(!q)return [];
  const a=areaOf(S.area);
  const pool=S.scope==='all'?allNodes():a.calc?calcList(S.area):allNodes(S.area);
  const nq=norm(q),out=[];
  pool.forEach(n=>{
    if(n.type==='file'&&!fileOk(n))return; if(n.type==='folder'&&anyFilter())return;
    let where=null,snip='';
    if(norm(n.name).includes(nq))where='nome';
    else if(n.proc&&norm(n.proc).includes(nq))where='processo';
    else if(n.type==='file'&&norm(n.text).includes(nq)){where='conteudo';snip=snippet(n.text,q);}
    if(where)out.push({n,where,snip});
  });
  const rank={nome:0,processo:1,conteudo:2};
  return out.sort((x,y)=>rank[x.where]-rank[y.where]||x.n.name.localeCompare(y.n.name,'pt-BR'));
}

      <div class="d-flex align-items-center flex-wrap small text-secondary mt-1">${(TRASH.find(t=>t.item===n)?[{name:'Lixeira',id:''}]:p).map(x=>x.id?`<button type="button" class="btn btn-link btn-sm p-0" data-goto-folder="${x.id}">${esc(x.name)}</button>`:esc(x.name)).join(ic('chev',12))}</div>
      ${r.snip?`<div class="search-snippet text-secondary">${r.snip}</div>`:''}${n.type==='file'?`<div class="mt-2">${badges(n)}</div>`:''}</div>

<script>
'use strict';
/* =====================================================================
   7. SNACKBAR, MODAL/DRAWER, MENU, POPOVER

const SNACK_IC={success:'check',error:'alert',warning:'alert',info:'alert'};
function snackbar({tipo='info',titulo='',texto='',acao=null,duration=5000}){
  const t=document.createElement('div');t.className='snackbar snackbar-'+tipo;
  t.innerHTML=`<span class="snackbar-icon">${ic(SNACK_IC[tipo],16,2.4)}</span><div class="flex-fill">${titulo?`<span class="snackbar-title">${titulo}</span>`:''}<span>${texto}</span></div>`;
  if(acao){const b=document.createElement('button');b.type='button';b.className='btn btn-sm btn-outline-secondary rounded-pill';b.textContent=acao.label;b.onclick=()=>{acao.fn();t.remove();};t.appendChild(b);}
  $('#snackbars').appendChild(t);setTimeout(()=>t.remove(),duration);
}
const toast=(msg,{kind='',action=null,ms=5000}={})=>snackbar({tipo:kind==='ok'?'success':kind==='err'?'error':'info',texto:msg,acao:action,duration:action?ms+2500:ms});

/* Arrastar a alça para baixo fecha (no sistema: swipeToClose do DrawerService) */

  h.addEventListener('pointerdown',e=>{y0=e.clientY;h.setPointerCapture(e.pointerId);});

      if(a.disabled||a.loading)b.disabled=true;if(a.id)b.id=a.id;b.onclick=()=>a.fn&&a.fn(api);foot.appendChild(b);});foot.hidden=!acts.length;}};

}
let MENU=null;

function placeAt(el,x,y,alignRight=true){
  const dev=document.getElementById('device');dev.appendChild(el);
  const framed=document.body.classList.contains('framed'),d=framed?dev.getBoundingClientRect():{left:0,top:0,width:innerWidth,height:innerHeight};
  x-=d.left;y-=d.top;const r=el.getBoundingClientRect();
  el.style.left=Math.max(8,Math.min(alignRight?x-r.width:x,d.width-r.width-8))+'px';
  el.style.top=Math.max(8,Math.min(y+4,d.height-r.height-8))+'px';
}
/* Celular: menus e popovers abrem no drawer inferior compartilhado */
function sheetWrap(inner,label,onClose){
  const w=document.createElement('div');
  w.innerHTML=`<div class="drawer-backdrop" data-sheet-x></div><div class="drawer drawer-bottom" role="dialog" aria-modal="true" aria-label="${esc(label||'Opções')}"><div class="drawer-handle"></div><div class="drawer-body p-0"></div></div>`;
  $('.drawer-body',w).appendChild(inner);inner.classList.add('w-100');
  $('[data-sheet-x]',w).onclick=onClose;bindSwipe(w,onClose);
  document.getElementById('device').appendChild(w);return w;
}
function openMenu(items,title,x,y){
  closeMenu();closePop();
  const m=document.createElement('div');m.className='dropdown-menu';m.setAttribute('role','menu');
  m.innerHTML=title?`<div class="dropdown-header text-truncate">${esc(title)}</div>`:'';
  items.forEach(a=>{
    if(a==='-'){m.insertAdjacentHTML('beforeend','<hr class="dropdown-divider">');return;}
    const b=document.createElement('button');b.type='button';b.setAttribute('role','menuitem');b.className='dropdown-item'+(a.danger?' dropdown-item-danger':'');
    if(a.dis)b.disabled=true;
    b.innerHTML=ic(a.ic,16)+`<span class="flex-fill">${esc(a.t)}</span>`+(a.hint?badge('secondary',esc(a.hint)):a.kbd&&!isM()?`<span class="small text-secondary">${a.kbd}</span>`:'');
    if(a.dis&&a.why)b.title=a.why;
    b.onclick=e=>{e.stopPropagation();closeMenu();a.fn&&a.fn();};
    m.appendChild(b);
  });
  m.addEventListener('keydown',e=>{const bs=$$('button:not(:disabled)',m);const i=bs.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){e.preventDefault();bs[(i+1)%bs.length].focus();}
    if(e.key==='ArrowUp'){e.preventDefault();bs[(i-1+bs.length)%bs.length].focus();}
    if(e.key==='Escape'||e.key==='Tab'){e.preventDefault();closeMenu();}});
  if(isM()){m.classList.remove('dropdown-menu');m.classList.add('d-flex','flex-column','p-0');m.querySelector('.dropdown-header')?.classList.add('mb-0');MENU={el:sheetWrap(m,title,closeMenu),prev:document.activeElement};}
  else{MENU={el:m,prev:document.activeElement};placeAt(m,x,y);}
  const f=m.querySelector('button:not(:disabled)');if(f)f.focus();
}
let POP=null;
function closePop(){if(POP){POP.remove();POP=null;}}
function openPop(html,anchor,onMount,label){
  closePop();closeMenu();
  const p=document.createElement('div');p.className='dropdown-menu';p.innerHTML=html;
  if(isM()){p.className='d-flex flex-column';POP=sheetWrap(p,label,closePop);}
  else{POP=p;const r=anchor.getBoundingClientRect();placeAt(p,r.left,r.bottom,false);}
  if(onMount)onMount(p);
}
document.addEventListener('mousedown',e=>{
  if(MENU&&!MENU.el.contains(e.target))closeMenu();
  if(POP&&!POP.contains(e.target)&&!e.target.closest('[data-filter]'))closePop();
});
window.addEventListener('resize',()=>{closeMenu();closePop();});
document.addEventListener('scroll',e=>{if(!isM()&&!(MENU&&MENU.el.contains(e.target)))closeMenu();},true);

function menuFor(it,{multi=false}={}){

    const items=selItems(),allMerge=items.every(isMergeable),allFiles=items.every(i=>i.type==='file');
    if(S.area==='lix')return [{ic:'restore',t:`Restaurar ${items.length} itens`,fn:()=>doRestore(items)},'-',{ic:'trash',t:'Excluir definitivamente',danger:true,fn:()=>doPurge(items)}];
    return [
      {ic:'merge',t:'Unir PDFs…',dis:!(allMerge&&items.length>=2),why:'Selecione 2 ou mais PDFs/imagens',fn:()=>dlgMerge(items)},
      {ic:'compress',t:'Comprimir para protocolo…',dis:!allMerge,why:'Disponível para PDFs/imagens',fn:()=>dlgCompress(items)},
      {ic:'move',t:'Mover para…',fn:()=>dlgMove(items)},
      {ic:'tag',t:'Classificar documento…',dis:!allFiles,why:'Disponível só para arquivos',fn:()=>dlgSetTipo(items)},

      {ic:'trash',t:`Mover ${items.length} itens para a lixeira`,danger:true,kbd:'Del',fn:()=>doTrash(items)}
    ];
  }

      {ic:'trash',t:'Mover para a lixeira',danger:true,kbd:'Del',fn:()=>doTrash([it])}

  }
  const m=isMergeable(it);
  return [
    {ic:'open',t:'Abrir',kbd:'Enter',fn:()=>openPanel(it)},
    {ic:'eye',t:'Visualização rápida',kbd:'Espaço',fn:()=>quickLook(it)},
    {ic:'download',t:'Baixar',fn:()=>doDownload([it])},'-',
    {ic:'edit',t:'Renomear',kbd:'F2',fn:()=>startRename(it)},
    {ic:'move',t:'Mover para…',fn:()=>dlgMove([it])},
    {ic:'star',t:it.fav?'Remover dos favoritos':'Adicionar aos favoritos',fn:()=>toggleFav(it)},
    {ic:'tag',t:it.tipo?'Alterar classificação…':'Classificar documento…',hint:it.tipo?'':'Sem classificação',fn:()=>dlgSetTipo([it])},
    '-',
    {ic:'compress',t:'Comprimir para protocolo…',dis:!m,why:'Disponível para PDFs/imagens',fn:()=>dlgCompress([it])},
    {ic:'merge',t:'Unir com outros PDFs…',dis:!m,why:'Disponível para PDFs/imagens',fn:()=>dlgMerge([it],true)},
    {ic:'sign',t:'Assinar',dis:true,hint:'Em breve',why:'Integração de assinatura em definição'},
    {ic:'history',t:'Ver histórico',fn:()=>openPanel(it,'historico')},'-',

function setArea(k){
  const a=areaOf(k);S.area=k;if(!a.calc)store.set('lastContent',k);S.selMode=false;$('#device').classList.remove('msearch');S.path=[a.calc?VROOT[k]:ROOT[k]];S.sel.clear();S.selFile=null;S.tab='arquivos';S.renaming=null;S.q='';$('#q').value='';syncQ();
  store.set('area',k);loadFolder(cur());
}
function loadFolder(f){S.loadingId=f.id;render();setTimeout(()=>{if(S.loadingId===f.id){S.loadingId=null;render();}},260);}
function goFolder(f){
  if(!f||f.virtual)return;
  const root=pathOf(f)[0];const k=Object.keys(ROOT).find(x=>ROOT[x]===root);
  if(k&&k!==S.area){S.area=k;}
  S.path=pathOf(f);S.sel.clear();S.selFile=null;S.q='';$('#q').value='';syncQ();S.cursor=f.id;
  if(!inProcess())S.tab='arquivos';
  loadFolder(f);
}
function revealFile(f){
  if(TRASH.some(t=>t.item===f)){setArea('lix');S.selFile=f;S.sel=new Set([f.id]);render();return;}
  goFolder(f.parent);S.selFile=f;S.sel=new Set([f.id]);S.cursor=f.id;render();
}
function selectOnly(it){S.sel=new Set([it.id]);S.anchor=it.id;S.cursor=it.id;S.selFile=it.type==='file'?it:null;}

function newFolder(parent=cur()){
  const reason=createBlockReason(parent);if(reason){toast(reason,{kind:'err'});return;}
  if(cur()!==parent)goFolder(parent);
  const f=fo(uniqueName(parent,'Nova pasta'),[],{isNew:true,created:new Date()});parent.children.push(f);link(f,parent,parent.area);
  S.renaming=f.id;S.renameVal='';S.renameErr='';S.loadingId=null;render();
}
function startRename(it){
  const visible=(S.view==='list'?COLS.some(c=>c.includes(it))||(isT()&&GRID.includes(it)):GRID.includes(it))&&!S.q&&!PNL.item;
  if(!visible)return dlgRename(it);
  S.renaming=it.id;S.renameVal='';S.renameErr='';render();
}
function applyName(it,raw){
  const v=raw.trim();
  if(!v)return 'Informe o nome';
  if(/[\\/:*?"<>|]/.test(v))return 'Não use os caracteres \\ / : * ? " < > |';
  const ext=it.type==='file'?it.name.slice(it.name.lastIndexOf('.')):'';
  const full=v+ext;
  if(it.parent&&siblingsHave(it.parent,full,it))return 'Já existe um item com este nome nesta pasta';
  const old=it.name;it.name=full;
  if(it.isNew){delete it.isNew;log('pasta_criada',it);toast('Pasta criada',{kind:'ok'});}
  else if(old!==full){log('renomeado',it,`${old} → ${full}`);toast('Renomeado',{kind:'ok'});}
  return null;
}
function commitRename(save=true){
  const it=NODES.get(S.renaming);if(!it){S.renaming=null;return;}
  const inp=$('#rn-input');const val=inp?inp.value:S.renameVal;
  if(!save){if(it.isNew){it.parent.children.splice(it.parent.children.indexOf(it),1);NODES.delete(it.id);}S.renaming=null;S.renameVal='';S.renameErr='';render();return;}
  const err=applyName(it,val);
  if(err){S.renameVal=val;S.renameErr=err;render();return;}
  S.renaming=null;S.renameVal='';S.renameErr='';render();
}
function dlgRename(it){
  const ext=it.type==='file'?it.name.slice(it.name.lastIndexOf('.')):'';
  dialog({title:'Renomear',icon:'edit',body:`<div><label class="form-label" for="rn2">Nome</label><div class="d-flex align-items-center gap-2"><input type="text" class="form-control" id="rn2" value="${esc(ext?it.name.slice(0,-ext.length):it.name)}">${ext?`<span class="text-secondary">${esc(ext)}</span>`:''}</div><span id="rn2e" class="invalid-feedback"></span></div>`,
    actions:[{label:'Cancelar',fn:a=>a.close()},{label:'Salvar',kind:'save',id:'rn2-save',fn:a=>{const e=applyName(it,$('#rn2').value);if(e){$('#rn2e').textContent=e;$('#rn2').classList.add('is-invalid');return;}a.close();render();}}],
    onMount:()=>{const i=$('#rn2');i.select();i.onkeydown=e=>{if(e.key==='Enter')$('#rn2-save').click();};}});
}
function toggleFav(it){it.fav=!it.fav;toast(it.fav?'Adicionado aos favoritos':'Removido dos favoritos',{kind:'ok'});render();}
async function doTrash(items){
  items=items.filter(i=>!TRASH.some(t=>t.item===i));if(!items.length)return;
  const ok=await confirmDlg({title:'Mover para a lixeira',icon:'trash',text:items.length===1?`Mover <b>${esc(items[0].name)}</b> para a lixeira? Ele poderá ser restaurado por ${TRASH_DAYS} dias.`:`Mover <b>${items.length} itens</b> para a lixeira? Eles poderão ser restaurados por ${TRASH_DAYS} dias.`,ok:'Mover para a lixeira',danger:true});
  if(!ok)return;
  items.forEach(it=>{const p=it.parent;if(!p)return;log('excluido',it);it._procId=procFolderOf(it)?.id||null;p.children.splice(p.children.indexOf(it),1);it.parent=null;TRASH.push({item:it,from:p,at:new Date()});
    if(S.path.includes(it))S.path=S.path.slice(0,S.path.indexOf(it));S.sel.delete(it.id);if(S.selFile===it)S.selFile=null;if(PNL.item===it)closePanel();});
  toast(items.length===1?'Movido para a lixeira':`${items.length} itens movidos para a lixeira`,{action:{label:'Desfazer',fn:()=>doRestore(items,true)}});render();
}
function doRestore(items,silent=false){
  items.forEach(it=>{const i=TRASH.findIndex(t=>t.item===it);if(i<0)return;const t=TRASH[i];TRASH.splice(i,1);
    const alive=t.from&&(t.from.isRoot||pathOf(t.from)[0].isRoot)&&!TRASH.some(x=>isAncestor(x.item,t.from));
    const dest=alive?t.from:ROOT.meus;it.name=uniqueName(dest,it.name);dest.children.push(it);link(it,dest,dest.area);log('restaurado',it,alive?'':'origem indisponível → Meus documentos');S.sel.delete(it.id);if(S.selFile===it)S.selFile=null;});
  if(!silent)toast(items.length===1?'Restaurado para a pasta de origem':`${items.length} itens restaurados`,{kind:'ok'});render();
}
async function doPurge(items){
  const ok=await confirmDlg({title:'Excluir definitivamente',icon:'trash',text:`Esta ação <b>não pode ser desfeita</b>. Excluir ${items.length===1?'<b>'+esc(items[0].name)+'</b>':items.length+' itens'} para sempre?`,ok:'Excluir definitivamente',danger:true});
  if(!ok)return;
  items.forEach(it=>{const i=TRASH.findIndex(t=>t.item===it);if(i>=0)TRASH.splice(i,1);S.sel.delete(it.id);if(S.selFile===it)S.selFile=null;if(PNL.item===it)closePanel();});
  toast('Excluído definitivamente',{kind:'ok'});render();
}
async function emptyTrash(){
  if(!TRASH.length)return;
  const ok=await confirmDlg({title:'Esvaziar lixeira',icon:'trash',text:`Excluir definitivamente os <b>${TRASH.length} itens</b> da lixeira? Esta ação não pode ser desfeita.`,ok:'Esvaziar lixeira',danger:true});
  if(!ok)return;TRASH.length=0;S.sel.clear();S.selFile=null;toast('Lixeira esvaziada',{kind:'ok'});render();
}
/* Arquivo único: download direto. Pasta/seleção (.zip) = exportação em segundo plano (UI-Kit): libera a tela,
   avisa por snackbar (duration 15000) no sucesso/erro e inicia o download sozinho. */
function doDownload(items){
  const files=[];items.forEach(i=>walk(i,n=>{if(n.type==='file')files.push(n);}));
  files.forEach(f=>access(f,'baixado'));
  const fin=files.some(f=>pathOf(f)[0]===ROOT.fin),audit=fin?' · registrado na auditoria financeira':'';
  if(PNL.item)renderPanel();
  if(items.length===1&&items[0].type==='file'){toast(`Download iniciado: <b>${esc(items[0].name)}</b>${audit}`,{kind:'ok'});return;}
  const name=(items.length===1?items[0].name:'documentos')+'.zip';
  snackbar({tipo:'info',texto:`Preparando <b>${esc(name)}</b> em segundo plano. Você pode continuar usando o sistema.`,duration:4000});
  setTimeout(()=>snackbar({tipo:'success',titulo:'Download pronto',texto:`${esc(name)} · ${files.length} arquivo${files.length!==1?'s':''}${audit}`,duration:15000}),1800);
}
function moveItems(items,dest){
  const errs=[];let ok=0;
  items.forEach(it=>{const e=checkMove(it,dest);if(e){errs.push(`${it.name}: ${e}`);return;}
    const p=it.parent;p.children.splice(p.children.indexOf(it),1);dest.children.push(it);link(it,dest,dest.area);log('movido',it,'para '+dest.name);ok++;
    if(S.path.includes(it))S.path=S.path.slice(0,S.path.indexOf(it));});
  if(ok)toast(`${ok} ${ok===1?'item movido':'itens movidos'} para <b>${esc(dest.name)}</b>`,{kind:'ok'});
  if(errs.length)toast(errs.length===1?esc(errs[0]):`${errs.length} itens não foram movidos: ${esc(errs[0])}`,{kind:'err',ms:6000});
  S.sel.clear();if(S.selFile&&!S.selFile.parent)S.selFile=null;render();
}

/* ---------- Diálogo: Mover ---------- */
function dlgMove(items){
  const rootNode=pathOf(items[0].parent||items[0])[0];
  if(!rootNode||!rootNode.children){toast('Restaure o item antes de movê-lo',{kind:'err'});return;}
  let target=null;const open=new Set(pathOf(items[0].parent||rootNode).map(n=>n.id));
  const reasonFor=f=>{for(const it of items){const e=checkMove(it,f);if(e)return e;}return null;};
  const tree=()=>{const rows=[];const rec=(f,lv)=>{const subs=sortItems(f.children.filter(c=>c.type==='folder'));const r=reasonFor(f);
      rows.push(`<div class="d-flex align-items-center tree-indent-${Math.min(lv,3)}">${subs.length?`<button type="button" class="btn btn-icon btn-sm" data-tw="${f.id}" aria-label="${open.has(f.id)?'Recolher':'Expandir'} ${esc(f.name)}" aria-expanded="${open.has(f.id)}">${ic(open.has(f.id)?'chevDown':'chev',14)}</button>`:'<span class="btn-icon btn-sm d-inline-flex"></span>'}
        <button type="button" class="card-list-action tree-node ${target===f?'active':''}" data-t="${f.id}" role="treeitem" aria-selected="${target===f}" ${r?`disabled title="${esc(r)}"`:''}><span class="card-list-action__icon">${ic('folder',15)}</span><span class="card-list-action__label text-truncate">${esc(f.name)}</span>${r&&r.startsWith('Limite')?badge('secondary','Nível 3'):r&&r.startsWith('O item já')?badge('secondary','Local atual'):''}</button></div>`);
      if(open.has(f.id))subs.forEach(s=>rec(s,lv+1));};rec(rootNode,0);return rows.join('');};
  const paint=a=>{$('#mv-tree').innerHTML=tree();a.setActions([{label:'Cancelar',fn:x=>x.close()},{label:target?`Mover para “${esc(target.name)}”`:'Escolha o destino',kind:'pri',disabled:!target,fn:x=>{x.close();moveItems(items,target);}}]);};
  dialog({title:items.length===1?`Mover “${items[0].name}”`:`Mover ${items.length} itens`,icon:'move',
    body:`${eAlert('light',{html:'Pastas que ultrapassariam o limite de 3 níveis ficam desabilitadas.'})}<div class="tree border-top" id="mv-tree" role="tree"></div>`,
    onMount:a=>{paint(a);$('#mv-tree').onclick=e=>{const tw=e.target.closest('[data-tw]');if(tw){const id=tw.dataset.tw;open.has(id)?open.delete(id):open.add(id);paint(a);return;}
      const n=e.target.closest('[data-t]');if(!n||n.disabled)return;target=NODES.get(n.dataset.t);open.add(target.id);paint(a);};}});
}

/* ---------- Diálogo: Unir PDFs ---------- */
const progress=(id,pct=0)=>`<div class="progressbar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="progressbar__fill" ${id?`id="${id}"`:''} data-pct="${pct}"></div></div>`;
const setPct=(el,p)=>{if(el){el.style.width=Math.min(p,100)+'%';el.parentElement.setAttribute('aria-valuenow',Math.round(Math.min(p,100)));}};
function dlgMerge(items,pickMore=false){
  let order=items.filter(isMergeable);
  const base=order[0];const dest=base.parent||ROOT.meus;
  const candidates=pickMore?sortItems(dest.children.filter(c=>isMergeable(c)&&!order.includes(c))):[];
  const def=`Unificado — ${base.proc?base.proc.slice(0,7):pad(NOW.getDate())+'-'+pad(NOW.getMonth()+1)}.pdf`;
  const list=()=>order.map((f,i)=>`<div class="order-item border-bottom" draggable="true" data-o="${i}"><span class="grip text-secondary">${ic('grip',14)}</span>${badge('primary',String(i+1))}${typeIcon(f,16)}<span class="flex-fill text-truncate">${esc(f.name)}</span><span class="small text-secondary">${fmtSize(f.size)}</span>
    <button type="button" class="btn btn-icon btn-sm" data-up="${i}" ${i===0?'disabled':''} aria-label="Subir ${esc(f.name)}">${ic('up',14)}</button><button type="button" class="btn btn-icon btn-sm" data-dn="${i}" ${i===order.length-1?'disabled':''} aria-label="Descer ${esc(f.name)}">${ic('down',14)}</button><button type="button" class="btn btn-icon btn-sm" data-rm="${i}" aria-label="Remover ${esc(f.name)} da lista">${ic('x',14)}</button></div>`).join('');
  const total=()=>order.reduce((s,f)=>s+f.size,0);
  const paint=a=>{$('#mg-list').innerHTML=list();$('#mg-sum').textContent=`${order.length} arquivos · ${fmtSize(total())} no total`;
    const add=$('#mg-add');if(add){const rest=candidates.filter(c=>!order.includes(c));add.innerHTML=rest.length?`<option value="">Adicionar arquivo desta pasta…</option>`+rest.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join(''):'<option value="">Nenhum outro PDF/imagem nesta pasta</option>';}
    a.setActions([{label:'Cancelar',fn:x=>x.close()},{label:`${ic('merge',14)}Unir ${order.length} arquivos`,kind:'pri',disabled:order.length<2,fn:run}]);};
  const run=a=>{
    let name=$('#mg-name').value.trim()||def;if(!/\.pdf$/i.test(name))name+='.pdf';
    a.body.innerHTML=`<div><span class="form-label">Unindo ${order.length} arquivos em “${esc(name)}”</span>${progress('mg-p')}<span id="mg-s" class="form-text">Na fila…</span></div>`;
    a.setActions([{label:'Cancelar',fn:x=>x.close()},{label:'Unindo…',kind:'pri',loading:true}]);
    let p=0;const t=setInterval(()=>{p+=7+Math.random()*12;const el=$('#mg-p');if(!el){clearInterval(t);return;}

/* ---------- Diálogo: Comprimir (níveis de compressão) ---------- */
const NIVEIS=[{id:'leve',nome:'Leve',desc:'melhor qualidade de leitura',fator:0.72},{id:'equilibrada',nome:'Equilibrada',desc:'recomendado para protocolo',fator:0.45},{id:'maxima',nome:'Máxima',desc:'menor tamanho possível',fator:0.28}];
function dlgCompress(items){
  const files=items.filter(isMergeable);if(!files.length)return;
  let nivel='equilibrada',mode='replace';
  const radio=(name,v,on,l,d)=>`<label class="form-check"><input class="form-check-input" type="radio" name="${name}" value="${v}" ${on?'checked':''}><span class="fw-semibold">${l}</span><span class="small text-secondary ms-auto">${d}</span></label>`;
  const est=()=>{const f=NIVEIS.find(n=>n.id===nivel).fator,tot=files.reduce((s,x)=>s+x.size,0);$('#cp-est').innerHTML=eAlert('info',{icone:'compress',html:`Tamanho estimado: <b>${fmtSize(tot)} → ${fmtSize(Math.round(tot*f))}</b> (−${Math.round((1-f)*100)}%)`});};
  dialog({title:files.length===1?`Comprimir “${files[0].name}”`:`Comprimir ${files.length} arquivos`,icon:'compress',wide:true,
    body:`<fieldset class="p-0 border-0"><legend class="form-label">Nível de compressão</legend>${NIVEIS.map(n=>radio('cp',n.id,nivel===n.id,n.nome,n.desc)).join('')}</fieldset><div id="cp-est"></div>
      <fieldset class="p-0 border-0"><legend class="form-label">Resultado</legend>${radio('cpm','replace',true,'Substituir o arquivo original','mantém nome e local')}${radio('cpm','copy',false,'Criar uma cópia comprimida','mantém o original intacto')}</fieldset>
      <div id="cp-list">${files.map(f=>`<div class="order-item border-bottom" data-cp="${f.id}">${typeIcon(f,16)}<span class="flex-fill text-truncate">${esc(f.name)}</span><span class="small text-secondary tabular-nums cp-size">${fmtSize(f.size)}</span></div>`).join('')}</div>`,
    actions:[{label:'Cancelar',fn:a=>a.close()},{label:`${ic('compress',14)}Comprimir`,kind:'pri',fn:a=>run(a)}],
    onMount:a=>{est();a.body.addEventListener('change',e=>{if(e.target.name==='cp'){nivel=e.target.value;est();}if(e.target.name==='cpm')mode=e.target.value;});}});
  function run(a){
    a.setActions([{label:'Comprimindo…',kind:'pri',loading:true}]);$$('fieldset,#cp-est',a.body).forEach(x=>x.remove());
    const fator=NIVEIS.find(n=>n.id===nivel).fator;let i=0;
    const next=()=>{if(i>=files.length){a.setActions([{label:'Concluir',kind:'pri',fn:x=>{x.close();render();}}]);toast(`${files.length} arquivo${files.length>1?'s':''} comprimido${files.length>1?'s':''}`,{kind:'ok'});return;}
      const f=files[i++],row=$(`[data-cp="${f.id}"]`,a.body);row.insertAdjacentHTML('beforeend',`<div class="w-40">${progress()}</div>`);
      const bar=$('.progressbar__fill',row);let p=0;const t=setInterval(()=>{p+=10+Math.random()*16;setPct(bar,p);
        if(p>=100){clearInterval(t);const before=f.size,after=Math.round(before*fator);let res=f;
          if(mode==='replace'){f.size=after;f.mtime=new Date();}
          else{res=fi(uniqueName(f.parent,f.name.replace(/(\.[^.]+)$/,' (comprimido)$1')),after/1024,0,{proc:f.proc,x:f.text});res.mtime=new Date();f.parent.children.push(res);link(res,f.parent,f.parent.area);}
          log('comprimido',res,`${fmtSize(before)} → ${fmtSize(after)}`);
          $('.progressbar',row).parentElement.remove();$('.cp-size',row).innerHTML=`${fmtSize(before)} → ${badge('positive',fmtSize(after)+' · −'+Math.round((1-after/before)*100)+'%')}`;next();}},140);};
    next();
  }
}

  const cats=CATS.map(c=>{const its=q?c.itens.filter(s=>norm(s.nome).includes(q)||norm(c.nome).includes(q)):c.itens;return {c,its};}).filter(x=>x.its.length);

    return `<div class="card picker-cat"><div class="card-header"><button type="button" class="card-list-action" data-cat="${c.id}" aria-expanded="${!!open}">${catBadge(c.cor,'',c.ic)}<span class="card-list-action__label fw-semibold">${esc(c.nome)}</span><span class="small text-secondary">${its.length}</span><span class="d-flex chevron">${ic(open?'up':'chevDown',15)}</span></button></div>${open?`<div class="card-body picker-chips">${its.map(s=>chip(s.id)).join('')}
      ${st.adding===c.id?`<div class="d-flex gap-2 w-100"><input type="text" class="form-control form-control-sm" data-newsubin="${c.id}" placeholder="Nome da nova subcategoria" aria-label="Nome da nova subcategoria em ${esc(c.nome)}"><button type="button" class="btn btn-sm btn-success rounded-pill" data-newsubok="${c.id}">Adicionar</button></div>`
      :`<button type="button" class="btn btn-sm btn-outline-success rounded-pill" data-addsub="${c.id}">${ic('plus',12)}Nova subcategoria</button>`}</div>`:''}</div>`;}).join('')

function mountPicker(root,st,onPick){
  const paint=()=>{$('.picker-body',root).innerHTML=pickerHTML(st);const n=$('[data-newsubin]',root);if(n){n.focus();n.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('[data-newsubok]',root).click();}if(e.key==='Escape'){e.stopPropagation();st.adding=null;paint();}};}};

const pickerTrigger=(t,attrs)=>`<button type="button" class="form-select form-select-sm picker-trigger" ${attrs} aria-haspopup="listbox">${t?`${catBadge(t.cor,esc(curto(t.nome)))}<span class="small text-secondary text-truncate flex-fill">${esc(t.cat.nome)}</span>`:'<span class="flex-fill text-secondary">Classificar…</span>'}${ic('chevDown',13)}</button>`;

  const apply=(id,tipo)=>{const p=pend.get(id);if(!p||!tipo)return;const sug=p.sug[0]&&p.sug[0].tipo;p.f.tipo=tipo;log('tipado',p.f,curto(tipoById(tipo).nome));const w=aprender(p.f,tipo,sug);if(w)learned.push({w,t:curto(tipoById(tipo).nome)});pend.delete(id);done++;};
