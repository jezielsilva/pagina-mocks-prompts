<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transferência</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--line:#e2e8f0;--txt:#0f172a;--sub:#64748b;--pri:#70398c;--pri-l:#f6f0fa;--ok:#2e7d5b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a21;--line:#2a2f3a;--txt:#e6e8ee;--sub:#94a3b8;--pri:#b48ad0;--pri-l:#2a2034;--ok:#5fc89a}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;flex:1}
header small{color:var(--sub)}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
main{flex:1;display:grid;grid-template-columns:320px 1fr;min-height:0}
aside{border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0}
.tools{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.tools input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--txt);font:inherit}
.tabs{display:flex;gap:6px}.tabs button{padding:4px 12px;font-size:13px}.tabs button.on{background:var(--pri-l);border-color:var(--pri);color:var(--pri)}
ul{list-style:none;margin:0;padding:10px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:6px}
li button.item{white-space:normal;width:100%;text-align:left;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:10px 40px 10px 12px;display:grid;grid-template-columns:34px minmax(0,1fr);column-gap:10px;row-gap:3px;align-items:center;font-weight:400;transition:border-color .15s,box-shadow .15s}
li button.item:hover{border-color:var(--pri);box-shadow:0 2px 8px rgba(112,57,140,.12)}
li button.item.on{background:var(--pri-l);border-color:var(--pri)}
li button.item.novo{border-left:3px solid var(--pri)}
.ic{grid-row:span 2;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;background:var(--bg)}
.ic.prompt{background:var(--pri-l)}
li b{min-width:0;overflow-wrap:anywhere;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.meta{min-width:0;font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.novo-tag{font-size:10px;font-weight:800;letter-spacing:.04em;border-radius:999px;padding:1px 7px;background:var(--pri);color:#fff}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--bg);color:var(--sub)}
.tag.prompt{background:var(--pri-l);color:var(--pri)}
section{display:flex;flex-direction:column;min-height:0;min-width:0}
.bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.bar h2{font-size:15px;margin:0;flex:1;min-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view{flex:1;min-height:0;overflow:auto}
iframe{width:100%;height:100%;border:0;background:#fff;display:block}
pre{margin:0;padding:20px;white-space:pre-wrap;word-wrap:break-word;font:13px/1.55 ui-monospace,Consolas,monospace}
.empty{padding:40px;color:var(--sub);text-align:center}
.toast{position:fixed;bottom:16px;right:16px;background:var(--ok);color:#fff;padding:8px 14px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
#back{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.box{background:var(--card);border-radius:14px;width:min(640px,100%);max-height:92vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.box h3{margin:0;font-size:16px}
.box textarea,.box input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--txt);font:inherit}
.box textarea{min-height:110px;resize:vertical}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--sub);cursor:pointer}
.drop.over{border-color:var(--pri);color:var(--pri)}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumbs div{position:relative}.thumbs img{width:110px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:2px;right:2px;padding:0 7px;font-size:12px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.resp{padding:20px;display:flex;flex-direction:column;gap:12px}.resp img{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.hint{font-size:12px;color:var(--sub)}
li{position:relative}
.del{position:absolute;top:10px;right:8px;padding:2px 8px;font-size:13px;opacity:0;border-color:transparent;background:transparent}
li:hover .del,.del:focus{opacity:1}.del:hover{border-color:#dc2626;color:#dc2626}
@media (hover:none){.del{opacity:.7}}
/* Lista recolhível (desktop) */
main{transition:grid-template-columns .2s}
main.wide{grid-template-columns:0 1fr}main.wide aside{visibility:hidden;border:0}
/* Barra do item sempre visível */
.bar{position:sticky;top:0;z-index:5}
/* Prompt legível */
pre{max-width:960px;margin:0 auto;overflow-wrap:anywhere}
/* Palco do mock com tamanho de dispositivo */
.stage{height:100%;overflow:hidden;position:relative;background:var(--bg)}
.stage.fill iframe{width:100%;height:100%}
.stage:not(.fill) .frame{position:absolute;left:50%;top:12px;transform-origin:top center;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 12px 32px rgba(0,0,0,.18);background:#fff}
.stage:not(.fill) iframe{width:100%;height:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 12px;font-size:13px}
.seg button.on{background:var(--pri-l);color:var(--pri)}
/* Prints */
.ic img{width:34px;height:34px;object-fit:cover;border-radius:10px;display:block}
.tag.princ{background:#fef3c7;color:#92400e}
.tag.print{background:#e0f2fe;color:#0369a1}
.shot{padding:16px;display:flex;justify-content:center}.shot img{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}
.howto{padding:24px;max-width:640px;margin:0 auto;color:var(--sub);line-height:1.6}.howto b{color:var(--txt)}
.tabs{flex-wrap:wrap}
@media (max-width:760px){
  main{grid-template-columns:1fr}main.wide{grid-template-columns:1fr}aside.hide{display:none}section.hide{display:none}#back{display:inline-flex}
  header{flex-wrap:wrap;gap:8px;padding:10px 12px}header h1{flex:1 1 auto}#upd,#tgl{display:none}
  header .btn,header button{padding:5px 10px;font-size:13px}
  .bar{padding:8px 12px}.bar h2{min-width:0;flex:1 1 100%;order:2;white-space:normal}#back{order:1}#acts{order:3;display:flex;gap:6px;flex-wrap:wrap}
  pre{padding:14px;font-size:12.5px}
}
</style>
</head>
<body>
<header><button id="tgl" title="Mostrar/ocultar lista" aria-label="Mostrar ou ocultar lista">☰</button><h1>Transferência</h1><small id="upd"></small><a id="novo" class="btn pri" href="https://github.com/jezielsilva/pagina-mocks-prompts/issues/new?title=Resposta%3A%20&body=Descreva%20o%20problema%20e%20cole%20os%20prints%20aqui%20(Ctrl%2BV)." target="_blank" rel="noopener">＋ Nova resposta</a><button id="reload" title="Recarregar lista">↻ Atualizar</button></header>
<main>
  <aside id="side">
    <div class="tools">
      <input id="q" type="search" placeholder="Buscar…" aria-label="Buscar">
      <div class="tabs" role="tablist"><button data-f="" class="on">Todos</button><button data-f="prompt">Prompts</button><button data-f="artefato">Artefatos</button><button data-f="resposta">Respostas</button><button data-f="print">Prints</button></div>
    </div>
    <ul id="list"></ul>
  </aside>
  <section id="main" class="hide">
    <div class="bar"><button id="back">← Voltar</button><h2 id="ttl">Selecione um item</h2><span id="acts"></span></div>
    <div class="view" id="view"><div class="empty">Escolha um prompt ou artefato na lista.</div></div>
  </section>
</main>
<div class="toast" id="toast">Copiado!</div>

<script>
// Fonte única: itens.json (gerado/atualizado pelo Claude a cada envio). Arquivos em /prompts e /artefatos.
const $=s=>document.querySelector(s);
let ITENS=[],F='',SEL=null;
// Estado só deste navegador: itens já abertos (tira o NOVO) e itens ocultados pelo 🗑
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}};
let VISTOS=ls('vistos')||{},OCULT=ls('ocultos')||[];
const novo=i=>VISTOS[i.id]!==i.data;
const TIPO={prompt:['📝','Prompt'],artefato:['🖼','Artefato'],resposta:['💬','Resposta'],print:['📷','Print']};
const fmt=d=>{const x=new Date(d);return isNaN(x)?'':x.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});};
async function load(){
  try{const r=await fetch('itens.json?t='+Date.now());const j=await r.json();ITENS=[...j.itens,...await loadRespostas(),...await loadPrints()].sort((a,b)=>b.data.localeCompare(a.data));$('#upd').textContent='Atualizado '+fmt(j.atualizado);}
  catch(e){$('#list').innerHTML='<li class="empty">Não foi possível ler itens.json (abra pelo GitHub Pages).</li>';return;}
  paint();const h=decodeURIComponent(location.hash.slice(1));open(ITENS.find(i=>i.id===h)||null,false);
}
function paint(){
  const q=$('#q').value.toLowerCase();
  const l=ITENS.filter(i=>!OCULT.includes(i.id)&&(!F||i.tipo===F)&&(!q||(i.titulo+' '+(i.projeto||'')).toLowerCase().includes(q)));
  $('#list').innerHTML=l.length?l.map(i=>`<li><button data-id="${i.id}" class="item ${SEL&&SEL.id===i.id?'on':''} ${novo(i)?'novo':''}"><span class="ic ${i.tipo}">${i.tipo==='print'?`<img src="${i.arquivo}" alt="" loading="lazy">`:TIPO[i.tipo][0]}</span><b>${i.titulo}</b><span class="meta">${novo(i)?'<span class="novo-tag">NOVO</span>':''}<span class="tag ${i.tipo}">${TIPO[i.tipo][1]}</span>${i.principal?'<span class="tag princ">★ Principal</span>':''}${[i.projeto,fmt(i.data)].filter(Boolean).join(' · ')}</span></button>${i.tipo==='resposta'?'':`<button class="del" data-del="${i.id}" title="Excluir" aria-label="Excluir ${i.titulo}">🗑</button>`}</li>`).join(''):(F==='print'?'<li class="empty">Nenhum print. Suba imagens na pasta <b>prints/</b> do repositório.</li>':'<li class="empty">Nada encontrado.</li>');
}
async function open(i,push=true){
  SEL=i;if(i){VISTOS[i.id]=i.data;ls('vistos',VISTOS);}paint();if(!i)return;
  if(push)history.replaceState(null,'','#'+encodeURIComponent(i.id));
  $('#side').classList.add('hide');$('#main').classList.remove('hide');
  $('#ttl').textContent=i.titulo;
  if(i.tipo==='resposta')return openResposta(i);
  if(i.tipo==='print'){$('#acts').innerHTML=`<a class="btn" href="${i.arquivo}" target="_blank" rel="noopener">Abrir em nova aba</a>`;$('#view').innerHTML=`<div class="shot"><img src="${i.arquivo}" alt="${i.titulo}"></div>`;return;}
  if(i.tipo==='artefato'){
    $('#acts').innerHTML=`<span class="seg" role="group" aria-label="Tamanho da tela">${Object.keys(DEV).map(k=>`<button data-dev="${k}" class="${k===DV?'on':''}">${DEV[k].n}</button>`).join('')}</span> ${i.principal||i.asset?'':`<a class="btn" href="${principalUrl(i)}" target="_blank" rel="noopener" title="Abre um pedido no GitHub; o Claude aplica e remove os outros mocks">★ Tornar principal</a>`} <a class="btn" href="${i.arquivo}" target="_blank" rel="noopener">Nova aba</a> <a class="btn pri" href="${i.arquivo}" download>Baixar</a>`;
    $('#view').innerHTML=`<div class="stage" id="stage"><div class="frame" id="frame"><iframe src="${i.arquivo}" title="${i.titulo}"></iframe></div></div>`;
    fit();
  }else{
    $('#acts').innerHTML='<button class="btn pri" id="cp">Copiar prompt</button>';
    $('#view').innerHTML='<pre id="txt">Carregando…</pre>';
    const t=await (await fetch(i.arquivo+'?t='+Date.now())).text();$('#txt').textContent=t;
    $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(t);}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();}
      $('#toast').classList.add('on');setTimeout(()=>$('#toast').classList.remove('on'),1400);};
  }
}
$('#list').onclick=e=>{const d=e.target.closest('[data-del]');if(d){e.stopPropagation();excluir(d.dataset.del);return;}const b=e.target.closest('[data-id]');if(b)open(ITENS.find(i=>i.id===b.dataset.id));};
$('.tabs').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;F=b.dataset.f;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));paint();};
$('#q').oninput=paint;
// ===== Mock em tamanho de dispositivo: a moldura tem o tamanho real e é reduzida para caber, sem vazar =====
// Tornar principal: abre uma Issue pré-preenchida (sem token). O Claude lê, marca este mock como principal e apaga os outros.
const principalUrl=i=>'https://github.com/jezielsilva/pagina-mocks-prompts/issues/new?title='+encodeURIComponent('Tornar principal: '+i.id)+'&body='+encodeURIComponent('Tornar o mock "'+i.titulo+'" ('+i.arquivo+') o principal e excluir os outros mocks.');
const DEV={fill:{n:'Ajustar'},pc:{n:'PC',w:1366,h:768},tab:{n:'Tablet',w:820,h:1180},cel:{n:'Celular',w:390,h:844}};
let DV=ls('dev')||'fill';
function fit(){
  const st=$('#stage'),fr=$('#frame');if(!st||!fr)return;
  st.classList.toggle('fill',DV==='fill');
  if(DV==='fill'){fr.style.cssText='';return;}
  const d=DEV[DV],aw=st.clientWidth-24,ah=st.clientHeight-24,k=Math.min(1,aw/d.w,ah/d.h);
  fr.style.cssText=`width:${d.w}px;height:${d.h}px;transform:translateX(-50%) scale(${k})`;
}
new ResizeObserver(fit).observe(document.body);
$('#acts').onclick=e=>{const b=e.target.closest('[data-dev]');if(!b)return;DV=b.dataset.dev;ls('dev',DV);document.querySelectorAll('[data-dev]').forEach(x=>x.classList.toggle('on',x===b));fit();};
// ===== Lista recolhível =====
if(ls('wide'))document.querySelector('main').classList.add('wide');
$('#tgl').onclick=()=>{const m=document.querySelector('main');m.classList.toggle('wide');ls('wide',m.classList.contains('wide'));setTimeout(fit,220);};
// ===== Prints = imagens da pasta prints/ do repositório (API pública, sem token) =====
async function loadPrints(){
  try{const r=await fetch('https://api.github.com/repos/jezielsilva/pagina-mocks-prompts/contents/prints?t='+Date.now());if(!r.ok)return [];
    return (await r.json()).filter(f=>/\.(png|jpe?g|gif|webp)$/i.test(f.name)).map(f=>{const m=f.name.match(/(\d{4})[-_]?(\d{2})[-_]?(\d{2})/);return {id:'p-'+f.sha,tipo:'print',titulo:f.name,projeto:'prints/',data:m?`${m[1]}-${m[2]}-${m[3]}T12:00:00`:'',arquivo:'prints/'+encodeURIComponent(f.name)};});
  }catch(e){return [];}
}$('#reload').onclick=load;
$('#back').onclick=()=>{$('#side').classList.remove('hide');$('#main').classList.add('hide');};

// ===== Respostas = Issues do repositório (sem token: o usuário abre a Issue logado no GitHub e cola os prints) =====
const REPO_API='https://api.github.com/repos/jezielsilva/pagina-mocks-prompts/issues';
let ISSUES={};
async function loadRespostas(){
  try{const r=await fetch(REPO_API+'?state=open&per_page=50');if(!r.ok)return [];const d=(await r.json()).filter(x=>!x.pull_request);
    d.forEach(x=>ISSUES['r-'+x.number]=x);
    return d.map(x=>({id:'r-'+x.number,tipo:'resposta',titulo:`#${x.number} ${x.title}`,projeto:x.state==='open'?'aberta':'resolvida',data:x.created_at}));
  }catch(e){return [];}
}
async function openResposta(i){
  const x=ISSUES[i.id];
  $('#acts').innerHTML=`<a class="btn" href="${x.html_url}" target="_blank" rel="noopener">Abrir no GitHub</a>`;
  const r=await fetch(x.url,{headers:{Accept:'application/vnd.github.html+json'}});const j=await r.json().catch(()=>({}));
  $('#view').innerHTML=`<div class="resp">${j.body_html||'<i>Sem texto.</i>'}</div>`;
}

// ===== Excluir: oculta neste navegador (sem token). Os arquivos do repositório o Claude limpa quando pedido no chat =====
const toast=t=>{const x=$('#toast');x.textContent=t;x.classList.add('on');setTimeout(()=>{x.classList.remove('on');x.textContent='Copiado!';},2000);};
function excluir(id){
  const it=ITENS.find(i=>i.id===id);if(!it||!confirm(`Excluir "${it.titulo}" da lista?`))return;
  OCULT.push(id);ls('ocultos',OCULT);
  if(SEL&&SEL.id===id){SEL=null;$('#view').innerHTML='<div class="empty">Item excluído.</div>';$('#ttl').textContent='';$('#acts').innerHTML='';}
  paint();toast('Excluído');
}
load();
</script>
</body>
</html>
